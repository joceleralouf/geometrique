  }
}
function ensureBase(W, H, pal){
  const key = [src.id, S.palette, S.opacite, S.couleur, S.lignes, S.seed, W, H].join('|');
  if (key === baseKey) return;
  baseCv.width = W; baseCv.height = H;
  drawBase(baseCtx, W, H, pal, false);
  baseKey = key;
}

/* ==========================================================
   16. DITHER (encre et papier)
   ========================================================== */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const BLEND = { normal: 'source-over', produit: 'multiply', ecran: 'screen', superposition: 'overlay' };

function updateDither(W, H, u, pal, anim){
  const p = Math.max(src.type === 'video' ? 2 : 1, Math.round((1 + S.dGrain / 100 * 23) * u));
  const dw = Math.ceil(W / p), dh = Math.ceil(H / p);
  const key = [src.id, W, H, p, S.dither, S.dSeuil, S.palette, S.seed].join('|');
  if (!anim && key === dKey) return p;
  dKey = key;
  if (dCv.width !== dw || dCv.height !== dh){ dCv.width = dw; dCv.height = dh; }
  dCtx.globalCompositeOperation = 'source-over'; dCtx.globalAlpha = 1;
  drawSource(dCtx, dw, dh);
  const im = dCtx.getImageData(0, 0, dw, dh), d = im.data, n = dw * dh;
  const L = new Float32Array(n), off = (S.dSeuil - 50) * 2.2;
  for (let i = 0, j = 0; i < n; i++, j += 4) L[i] = (d[j] * 0.299 + d[j + 1] * 0.587 + d[j + 2] * 0.114 - 128) * 1.25 + 128 - off;
  const ink = hexRgb(pal.fond), paper = hexRgb(pal.ligne), alg = S.dither;
  const ox = (S.seed * 7 + (anim ? frameNo * 5 : 0)) % 64, oy = (S.seed * 3) % 64;
  for (let y = 0; y < dh; y++){
    for (let x = 0; x < dw; x++){
      const i = y * dw + x, old = L[i];
      let on;
      if (alg === 'bayer') on = old > (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) * 16;
      else if (alg === 'bruit'){ const t = 0.06711056 * (x + ox) + 0.00583715 * (y + oy); on = old > ((52.9829189 * (t - Math.floor(t))) % 1) * 255; }
      else {
        on = old >= 128;
        const err = old - (on ? 255 : 0);
        if (alg === 'atkinson'){
          const e = err / 8;
          if (x + 1 < dw) L[i + 1] += e; if (x + 2 < dw) L[i + 2] += e;
          if (y + 1 < dh){ if (x > 0) L[i + dw - 1] += e; L[i + dw] += e; if (x + 1 < dw) L[i + dw + 1] += e; }
          if (y + 2 < dh) L[i + 2 * dw] += e;
        } else {
          if (x + 1 < dw) L[i + 1] += err * 7 / 16;
          if (y + 1 < dh){ if (x > 0) L[i + dw - 1] += err * 3 / 16; L[i + dw] += err * 5 / 16; if (x + 1 < dw) L[i + dw + 1] += err / 16; }
        }
      }
      const c = on ? paper : ink, j = i * 4;
      d[j] = c[0]; d[j + 1] = c[1]; d[j + 2] = c[2]; d[j + 3] = 255;
    }
  }
  dCtx.putImageData(im, 0, 0);
  return p;
}
function drawDither(W, H, u, pal, anim){
  const p = updateDither(W, H, u, pal, anim);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = S.dOpa / 100; ctx.globalCompositeOperation = BLEND[S.dFusion] || 'source-over';
  ctx.drawImage(dCv, 0, 0, dCv.width * p, dCv.height * p);
  ctx.imageSmoothingEnabled = true; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

/* ==========================================================
   17. PIXEL MEMORY (cellules binaires, glyphes, écho, fenêtres)
   ========================================================== */
// Rafraîchissement : tous les combien d'images le motif change en mouvement
function memSlot(anim){
  if (!anim || S.mRefresh <= 0) return 0;
  return (frameNo / Math.max(1, Math.round(30 - S.mRefresh * 0.29))) | 0;
}
// Taille des cellules (proportion 50 = carré)
function memGeom(u){
  const p = Math.max(3, (6 + Math.pow(S.mCell / 100, 1.6) * 180) * u), f = Math.sqrt(Math.pow(2, (S.mRatio - 50) / 25));
  return { cw: Math.max(2, p * f), ch: Math.max(2, p / f) };
}
const MEM_KEYS = ['memoire', 'mRendu', 'mCell', 'mRatio', 'mEcart', 'mEntropie', 'mCible', 'mSeuil', 'mCouv', 'mPrio', 'mCouleur', 'mNiveaux', 'mContraste', 'mAccent', 'mSep', 'mDecal', 'mRefresh'];

function updateMemory(W, H, u, pal, anim){
  const slot = memSlot(anim), g = memGeom(u);
  const key = [src.id, W, H, slot, S.palette, S.seed, S.seuil].concat(MEM_KEYS.map(k => S[k])).join('|');
  if (key === mKey) return;
  mKey = key;
  if (mCv.width !== W || mCv.height !== H){ mCv.width = W; mCv.height = H; } else mCtx.clearRect(0, 0, W, H);
  const cols = Math.ceil(W / g.cw), rows = Math.ceil(H / g.ch);
  tCv.width = cols; tCv.height = rows; drawSource(tCtx, cols, rows);
  const d = tCtx.getImageData(0, 0, cols, rows).data;
  const cutL = S.mSeuil / 100 * 255, thrE = threshold() * 1.2, couv = S.mCouv / 100, prio = S.mPrio / 100;
  const ent = S.mEntropie / 100, gap = S.mEcart / 100 * 0.5, shift = S.mDecal / 100, seed = S.seed + slot * 131;
  const edgeAt = (x, y) => {
    if (!MAG) return 0;
    const ax = clamp(Math.round((x + 0.5) * g.cw / W * AW), 0, AW - 1), ay = clamp(Math.round((y + 0.5) * g.ch / H * AH), 0, AH - 1);
    return MAG[ay * AW + ax];
  };

  // 1. Choix des cellules
  const cells = [], MAXC = 16000, bandH = Math.max(1, Math.round(rows * 0.05));
  for (let y = 0; y < rows && cells.length < MAXC; y++){
    // Décalage : certaines bandes lisent la photo plus loin (mémoire corrompue)
    const band = (y / bandH) | 0;
    const sh = shift > 0 && hash2(seed + 77, band) < 0.35 + shift * 0.5 ? Math.round((hash2(seed + 78, band) - 0.5) * 2 * shift * cols * 0.35) : 0;
    for (let x = 0; x < cols; x++){
      const sx = ((x + sh) % cols + cols) % cols, j = (y * cols + sx) * 4;
      const l = d[j] * 0.299 + d[j + 1] * 0.587 + d[j + 2] * 0.114, e = edgeAt(x, y) > thrE;
      const ok = S.mCible === 'clairs' ? l > cutL : S.mCible === 'sombres' ? l < cutL : S.mCible === 'contours' ? e : true;
      if (!ok) continue;
      const id = y * cols + x;
      if (hash2(seed, id) >= couv * (e ? 1 + prio * 1.5 : 1 - prio * 0.7)) continue;
      // Entropie : taille et position irrégulières
      const h2 = hash2(seed + 1, id), h3 = hash2(seed + 2, id), sc = 1 - ent * 0.7 * h2;
      const w = g.cw * (1 - gap) * sc, h = g.ch * (1 - gap) * sc;
      const cx = (x + 0.5) * g.cw + (h3 - 0.5) * ent * g.cw * 0.9, cy = (y + 0.5) * g.ch + (h2 - 0.5) * ent * g.ch * 0.9;
      cells.push([cx - w / 2, cy - h / 2, w, h, d[j], d[j + 1], d[j + 2], l, e, h3]);
    }
  }

  // 2. Couleur : contraste, niveaux, mode
  const cf = 1 + (S.mContraste - 50) / 50 * 1.2, L = S.mNiveaux >= 100 ? 0 : 2 + Math.round(S.mNiveaux / 100 * 14);
  const q = v => L ? Math.round(v / 255 * (L - 1)) * 255 / (L - 1) : v;
  const ct = v => clamp((v - 128) * cf + 128, 0, 255);
  const F = hexRgb(pal.fond), Li = hexRgb(pal.ligne), Fo = hexRgb(pal.forme);
  const colorOf = c => {
    let r = ct(c[4]), gg = ct(c[5]), b = ct(c[6]);
    if (S.mCouleur === 'palette'){
      // Glyphes : jamais la couleur du fond, sinon ils disparaissent dans les zones sombres
      const t = q(ct(c[7])) / 255, gl = S.memoire === 'glyphes';
      const A = gl || t >= 0.5 ? Li : F, B = gl || t >= 0.5 ? Fo : Li, k = gl ? t : t < 0.5 ? t * 2 : (t - 0.5) * 2;
      return 'rgb(' + [0, 1, 2].map(i => Math.round(A[i] + (B[i] - A[i]) * k)).join(',') + ')';
    }
    if (S.mCouleur === 'mono'){ r = gg = b = r * 0.299 + gg * 0.587 + b * 0.114; }
    else if (S.mCouleur === 'inverse'){ r = 255 - r; gg = 255 - gg; b = 255 - b; }
    return 'rgb(' + Math.round(q(r)) + ',' + Math.round(q(gg)) + ',' + Math.round(q(b)) + ')';
  };

  // 3. Dessin
  const lw = Math.max(1, 0.8 * u), R = S.mRendu, acc = new Path2D(), sep = new Path2D(), accent = S.mAccent / 100;
  mCtx.lineWidth = lw;
  if (S.memoire === 'glyphes'){
    const ramp = ' .:-=+*#%@';
    mCtx.font = Math.max(5, Math.round(g.ch * 1.05)) + 'px ' + MONO(); mCtx.textAlign = 'center'; mCtx.textBaseline = 'middle';
    for (const c of cells){
      const ch = ramp[Math.min(ramp.length - 1, (c[7] / 256 * ramp.length) | 0)];
      if (ch === ' ') continue;
      mCtx.fillStyle = (c[8] && c[9] < accent) ? pal.ligne : colorOf(c);
      mCtx.fillText(ch, c[0] + c[2] / 2, c[1] + c[3] / 2);
    }
    return;
  }
  // Forme des blocs : la même que celle des fenêtres (carré, rond, hexagone, losange, mixte)
  const cellPath = (p, sh, x, y, w, h) => {
    if (sh === 'rond'){ p.moveTo(x + w, y + h / 2); p.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, 6.2832); }
    else if (sh === 'carre' || sh === 'rect') p.rect(x, y, w, h);
    else { winPts({ x, y, w, h }, sh).forEach(([px, py], k) => k ? p.lineTo(px, py) : p.moveTo(px, py)); p.closePath(); }
  };
  for (const c of cells){
    const [x, y, w, h] = c, col = colorOf(c);
    const sh = R === 'point' ? 'rond' : S.mFenForme === 'mixte' ? WIN_SHAPES[(c[9] * 5) | 0] : S.mFenForme;
    if (R === 'barre'){ mCtx.fillStyle = col; mCtx.fillRect(x, y + h * 0.35, w, Math.max(1, h * 0.3)); }
    else if (sh === 'carre' || sh === 'rect'){
      if (R === 'contour'){ mCtx.strokeStyle = col; mCtx.strokeRect(x + lw / 2, y + lw / 2, Math.max(1, w - lw), Math.max(1, h - lw)); }
      else { mCtx.fillStyle = col; mCtx.fillRect(x, y, w, h); sep.rect(x, y, w, h); }
    } else {
      const p = new Path2D(); cellPath(p, sh, x, y, w, h);
      if (R === 'contour'){ mCtx.strokeStyle = col; mCtx.stroke(p); }
      else { mCtx.fillStyle = col; mCtx.fill(p); cellPath(sep, sh, x, y, w, h); }
    }
    if (c[8] && c[9] < accent) acc.rect(x + 1.5 * u, y + 1.5 * u, Math.max(1, w - 3 * u), Math.max(1, h - 3 * u));
  }
  if ((R === 'bloc' || R === 'point') && S.mSep > 0){ mCtx.strokeStyle = pal.fond; mCtx.globalAlpha = S.mSep / 100; mCtx.stroke(sep); }
  mCtx.fillStyle = pal.ligne; mCtx.globalAlpha = 0.4; mCtx.fill(acc);
  mCtx.globalAlpha = 0.95; mCtx.strokeStyle = pal.ligne; mCtx.lineWidth = Math.max(1.5, 2 * u); mCtx.stroke(acc); mCtx.globalAlpha = 1;
}

// Écho : traînées de pixels étirées depuis une colonne (ou une ligne)
function drawEcho(W, H, u, anim){
  const g = memGeom(u), r = mulberry32(S.seed * 7 + memSlot(anim)), vert = S.mEchoDir === 'vertical';
  const step = vert ? g.cw : g.ch, span = vert ? W : H, other = vert ? H : W;
  const n = Math.round(span / step * (0.1 + S.mCouv / 100 * 0.8)), lenMax = S.mEchoLong / 100, a = S.mOpa / 100;
  ctx.globalCompositeOperation = BLEND[S.mFusion] || 'source-over';
  for (let k = 0; k < n; k++){
    const pos = Math.floor(r() * span / step) * step, o0 = r() * other * 0.85, len = (0.1 + r() * 0.9) * lenMax * (other - o0);
    ctx.globalAlpha = a * (0.4 + 0.6 * r());
    if (vert) ctx.drawImage(cv, pos, o0, step, Math.max(1, 2 * u), pos, o0, step, Math.max(1, len));
    else ctx.drawImage(cv, o0, pos, Math.max(1, 2 * u), step, o0, pos, Math.max(1, len), step);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// Fenêtres mémoire : grands cadres qui montrent un morceau zoomé de la photo,
// reliés par un trait à l'endroit d'où ils viennent.
// Deux sources : les zones choisies à la main (suivies en vidéo) et les points forts automatiques.
const WIN_SHAPES = ['carre', 'rect', 'rond', 'hexa', 'losange'];

// Contour d'une fenêtre selon sa forme (liste de points)
function winPts(b, shape){
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2, rx = b.w / 2, ry = b.h / 2, P = [];
  if (shape === 'rond') for (let k = 0; k < 56; k++){ const a = k / 56 * 6.2832; P.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
  else if (shape === 'hexa') for (let k = 0; k < 6; k++){ const a = k * Math.PI / 3; P.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
  else if (shape === 'losange') P.push([cx, b.y], [b.x + b.w, cy], [cx, b.y + b.h], [b.x, cy]);
  else P.push([b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]);
  return P;
}
function ptsPath(P, scale, cx, cy){
  const p = new Path2D();
  P.forEach(([x, y], k) => { const X = cx + (x - cx) * scale, Y = cy + (y - cy) * scale; k ? p.lineTo(X, Y) : p.moveTo(X, Y); });
  p.closePath(); return p;
}
// Point où le rayon centre → cible traverse le contour
function edgeHit(P, cx, cy, tx, ty){
  const dx = tx - cx, dy = ty - cy; let bt = Infinity;
  for (let i = 0; i < P.length; i++){
    const [px, py] = P[i], [qx, qy] = P[(i + 1) % P.length], ex = qx - px, ey = qy - py;
    const den = dx * ey - dy * ex; if (Math.abs(den) < 1e-9) continue;
    const t = ((px - cx) * ey - (py - cy) * ex) / den, s = ((px - cx) * dy - (py - cy) * dx) / den;
    if (t > 0 && s >= 0 && s <= 1 && t < bt) bt = t;
  }
  return bt < Infinity ? [cx + dx * bt, cy + dy * bt] : [tx, ty];
}

function drawWindows(W, H, u, pal, t, w, aBass, anim){
  const nAuto = S.mAuto === 'oui' ? Math.round(S.mFen / 100 * 16) : 0;
  if (!nAuto && !ZONES.length) return;
  const Lm = Math.min(W, H), base = (0.08 + S.mFenTaille / 100 * 0.32) * Lm, zoom0 = 1 + S.mZoom / 100 * 3;
  const r = mulberry32(S.seed * 53 + 7), m = 12 * u, kx = W / AW, ky = H / AH;

  // 1. Origines : zones choisies d'abord, puis points forts ou au hasard
  const items = ZONES.map((z, k) => ({ zone: z, key: 9000 + k, ox: (z.x + z.w / 2) * kx, oy: (z.y + z.h / 2) * ky, zw: z.w * kx, zh: z.h * ky, label: 'ZONE-' + String(k + 1).padStart(2, '0') }));
  if (nAuto && nP){
    const all = Array.from({ length: nP }, (_, i) => i);
    const order = S.mFenCible === 'hasard'
      ? all.sort((a, b) => hash2(S.seed + 31, PC[a]) - hash2(S.seed + 31, PC[b]))
      : heroIdx.concat(all.sort((a, b) => PS[b] - PS[a]));
    const used = [];
    for (const i of order){
      if (used.length >= nAuto) break;
      if (i < 0 || i >= nP || used.includes(i)) continue;
      if (items.some(o => Math.hypot(o.ox - QX[i], o.oy - QY[i]) < base * (S.mFenPlace === 'bord' ? 0.5 : 1.1))) continue;
      used.push(i);
      items.push({ key: PC[i], ox: QX[i], oy: QY[i], label: 'MEM-' + String(used.length).padStart(2, '0') });
    }
  }

  // 2. Placement en évitant les chevauchements
  const placed = [];
  const over = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  const col = S.mFenPlace === 'bord', colW = base * 0.72, gapC = 8 * u;
  const colRight = col && items.reduce((s, o) => s + o.ox, 0) / Math.max(1, items.length) < W / 2;
  let colI = 0, colY = m + 18 * u;
  items.forEach((it, k) => {
    const h1 = hash2(S.seed + 11, it.key), h2 = hash2(S.seed + 12, it.key), h3 = hash2(S.seed + 13, it.key);
    const shape = S.mFenForme === 'mixte' ? WIN_SHAPES[(h3 * 5) | 0] : S.mFenForme;
    let ww, hh, z;
    if (it.zone){
      // Zone choisie : la fenêtre garde ses proportions et agrandit la zone
      const big = Math.max(it.zw, it.zh);
      ww = clamp(big * zoom0, Lm * 0.14, Lm * (col ? 0.3 : 0.55));
      if (shape === 'rect'){ hh = ww * it.zh / Math.max(1, it.zw); if (hh > Lm * 0.55){ hh = Lm * 0.55; ww = hh * it.zw / it.zh; } z = ww / Math.max(1, it.zw); }
      else { hh = shape === 'hexa' ? ww * 0.87 : ww; z = ww / Math.max(1, big); }
    } else {
      ww = col ? colW : base * (1 - S.mFenVar / 100 * 0.65 * h1);
      hh = shape === 'rect' ? ww * (0.55 + h2 * 0.25) : shape === 'hexa' ? ww * 0.87 : ww;
      z = zoom0;
    }
    const own = it.zone ? { x: it.ox - it.zw / 2, y: it.oy - it.zh / 2, w: it.zw, h: it.zh } : { x: it.ox - 4, y: it.oy - 4, w: 8, h: 8 };
    let best;
    if (col){
      if (colY + hh > H - m - 18 * u){ colI++; colY = m + 18 * u; }
      best = { x: colRight ? W - m - ww - colI * (ww + gapC) : m + colI * (ww + gapC), y: colY, w: ww, h: hh }; colY += hh + gapC;
    } else {
      let bs = Infinity;
      const tries = S.mFenPlace === 'libre' ? 24 : 12;
      for (let a = 0; a < tries; a++){
        let x, y;
        if (S.mFenPlace === 'libre'){ x = r() * (W - ww); y = r() * (H - hh); }
        else {
          const ang = h2 * 6.2832 + a * Math.PI / 6, dist = (ww + hh) / 2 * (0.85 + 0.5 * h3) + (it.zone ? Math.max(it.zw, it.zh) / 2 : 0);
          x = it.ox + Math.cos(ang) * dist - ww / 2; y = it.oy + Math.sin(ang) * dist - hh / 2;
        }
        const c = { x: clamp(x, m, W - ww - m), y: clamp(y, m, H - hh - m), w: ww, h: hh };
        let sc = over(c, own) * 2;
        for (const p of placed) sc += over(c, p) + over(c, p.src) * 0.5;
        sc += Math.hypot(c.x + ww / 2 - it.ox, c.y + hh / 2 - it.oy) * (S.mFenPlace === 'libre' ? 0.5 : 2);
        if (sc < bs){ bs = sc; best = c; }
      }
    }
    if (anim) z *= 1 + 0.06 * Math.sin(t * w + k * 1.7) + aBass * 0.35;
    const sw = Math.min(W, best.w / z), sh = Math.min(H, best.h / z);
    best.src = { x: clamp(it.ox - sw / 2, 0, W - sw), y: clamp(it.oy - sh / 2, 0, H - sh), w: sw, h: sh };
    Object.assign(best, { ox: it.ox, oy: it.oy, z, shape, label: it.label, zone: !!it.zone });
    best.P = winPts(best, shape); best.sP = winPts(best.src, shape);
    placed.push(best);
  });

  const lw = Math.max(0.8, (0.5 + S.mLienEp / 100 * 4) * u);
  ctx.font = Math.round(9 * u) + 'px ' + MONO();

  // 3. Liens (sous les fenêtres), du bord du repère au bord de la fenêtre
  if (S.mLien !== 'aucun'){
    const p = new Path2D(), dots = new Path2D(), ds = 2.5 * u;
    for (const b of placed){
      const s = b.src, scx = s.x + s.w / 2, scy = s.y + s.h / 2, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      if (over(b, s) > 0.6 * s.w * s.h) continue;
      const [ax, ay] = edgeHit(b.sP, scx, scy, cx, cy);
      let ex, ey;
      if (S.mLien === 'coude' && !(ay > b.y && ay < b.y + b.h)){
        [ex, ey] = edgeHit(b.P, cx, cy, cx, ay);
        p.moveTo(ax, ay); p.lineTo(cx, ay); p.lineTo(ex, ey);
      } else if (S.mLien === 'coude'){
        [ex, ey] = edgeHit(b.P, cx, cy, ax, cy);
        p.moveTo(ax, ay); p.lineTo(ax, cy); p.lineTo(ex, ey);
      } else { [ex, ey] = edgeHit(b.P, cx, cy, ax, ay); p.moveTo(ax, ay); p.lineTo(ex, ey); }
      dots.rect(ax - ds, ay - ds, ds * 2, ds * 2); dots.rect(ex - ds, ey - ds, ds * 2, ds * 2);
    }
    ctx.globalAlpha = 0.9; ctx.lineWidth = lw; ctx.strokeStyle = pal.forme; ctx.stroke(p);
    ctx.fillStyle = pal.ligne; ctx.fill(dots); ctx.globalAlpha = 1;
  }

  // 4. Repères d'origine (pointillés, même forme que la fenêtre)
  if (S.mFenRepere === 'oui'){
    ctx.setLineDash([3 * u, 3 * u]); ctx.lineWidth = Math.max(0.8, 1.1 * u); ctx.strokeStyle = pal.ligne; ctx.globalAlpha = 0.95;
    for (const b of placed) ctx.stroke(ptsPath(b.sP, 1, 0, 0));
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  // 5. Fenêtres : contenu zoomé (pixelisé ou non), ton, cadre
  for (const b of placed){
    const s = b.src, pix = S.mFenPix / 100, cx = b.x + b.w / 2, cy = b.y + b.h / 2, path = ptsPath(b.P, 1, 0, 0);
    ctx.save(); ctx.clip(path); ctx.globalAlpha = 1;
    if (pix > 0.02){
      const px = Math.max(2, pix * Math.min(b.w, b.h) / 8);
      const tw = Math.max(1, Math.round(b.w / px)), th = Math.max(1, Math.round(b.h / px));
      if (fCv.width !== tw || fCv.height !== th){ fCv.width = tw; fCv.height = th; }
      drawSourceRect(fCtx, s.x, s.y, s.w, s.h, 0, 0, tw, th);
      ctx.imageSmoothingEnabled = false; ctx.drawImage(fCv, 0, 0, tw, th, b.x, b.y, b.w, b.h); ctx.imageSmoothingEnabled = true;
    } else drawSourceRect(ctx, s.x, s.y, s.w, s.h, b.x, b.y, b.w, b.h);
    if (S.mFenTon !== 'photo'){
      ctx.globalCompositeOperation = S.mFenTon === 'nb' ? 'saturation' : 'difference';
      ctx.fillStyle = S.mFenTon === 'nb' ? '#808080' : '#fff'; ctx.fillRect(b.x, b.y, b.w, b.h);
    }
    ctx.restore();
    if (S.mFenCadre === 'oui'){
      ctx.lineWidth = Math.max(1, 1.4 * u); ctx.strokeStyle = pal.forme; ctx.stroke(path);
      ctx.lineWidth = Math.max(0.8, u); ctx.strokeStyle = pal.ligne;
      if (b.shape === 'carre' || b.shape === 'rect'){
        // Coins de viseur
        const c = 7 * u, o = 4 * u, q = new Path2D();
        [[b.x - o, b.y - o, 1, 1], [b.x + b.w + o, b.y - o, -1, 1], [b.x - o, b.y + b.h + o, 1, -1], [b.x + b.w + o, b.y + b.h + o, -1, -1]]
          .forEach(([x, y, sx, sy]) => { q.moveTo(x + c * sx, y); q.lineTo(x, y); q.lineTo(x, y + c * sy); });
        ctx.stroke(q);
      } else { ctx.globalAlpha = 0.6; ctx.stroke(ptsPath(b.P, 1 + 6 * u / Math.min(b.w, b.h), cx, cy)); ctx.globalAlpha = 1; }
    }
  }

  // 6. Étiquettes en dernier
  if (S.mFenLabel === 'oui'){
    const track = src.type === 'video' && S.mSuivi === 'oui';
    for (const b of placed){
      ctx.fillStyle = pal.forme; ctx.globalAlpha = 0.95;
      const top = b.y - 7 * u > 12 * u;
      ctx.textBaseline = top ? 'bottom' : 'top';
      ctx.fillText(b.label + '  ×' + b.z.toFixed(1) + (b.zone && track ? '  SUIVI' : ''), b.x, top ? b.y - 7 * u : b.y + b.h + 7 * u);
      ctx.fillStyle = pal.ligne; ctx.textBaseline = 'top';
      ctx.fillText(pad4(b.ox) + ' ' + pad4(b.oy), b.src.x, Math.min(H - 12 * u, b.src.y + b.src.h + 4 * u));
    }
    ctx.globalAlpha = 1;
  }
}

/* ==========================================================
   17 quater. ZONES CHOISIES À LA MAIN ET SUIVI
   On trace un rectangle sur l'image ; en vidéo, la zone suit
   ce qu'elle contient (comparaison de motifs d'une image à l'autre).
   ========================================================== */
let ZONES = [], selecting = false, selA = null, selB = null;
const MAXZ = 6;

function grabTpl(z){
  if (!GRAY) return;
  const st = Math.max(1, Math.ceil(Math.max(z.w, z.h) / 24));
  const tw = Math.max(2, Math.floor(z.w / st)), th = Math.max(2, Math.floor(z.h / st));
  const tpl = new Float32Array(tw * th), x0 = Math.round(z.x), y0 = Math.round(z.y);
  for (let j = 0; j < th; j++) for (let i = 0; i < tw; i++) tpl[j * tw + i] = GRAY[clamp(y0 + j * st, 0, AH - 1) * AW + clamp(x0 + i * st, 0, AW - 1)];
  Object.assign(z, { tpl, tw, th, st });
}
function addZone(x, y, w, h){
  const W = cv.width, H = cv.height;
  if (ZONES.length >= MAXZ) ZONES.shift();
  const z = { x: x * AW / W, y: y * AH / H, w: w * AW / W, h: h * AH / H };
  grabTpl(z); ZONES.push(z);
  if (S.memoire === 'aucune'){ S.memoire = 'fenetres'; syncUI(); }
  updateZoneUI(); dirty = true;
}
function trackZones(){
  if (S.mSuivi !== 'oui' || !GRAY || !ZONES.length) return;
  const R = Math.max(6, Math.round(0.05 * Math.max(AW, AH)));
  for (const z of ZONES){
    if (!z.tpl){ grabTpl(z); continue; }
    const { tpl, tw, th, st } = z, x0 = Math.round(z.x), y0 = Math.round(z.y);
    const maxX = AW - 1 - (tw - 1) * st, maxY = AH - 1 - (th - 1) * st;
    const sad = (ox, oy, lim) => {
      let s = 0;
      for (let j = 0; j < th; j++){
        const row = (oy + j * st) * AW + ox, tr = j * tw;
        for (let i = 0; i < tw; i++) s += Math.abs(GRAY[row + i * st] - tpl[tr + i]);
        if (s > lim) return s;
      }
      return s;
    };
    let best = Infinity, bx = x0, by = y0;
    const test = (ox, oy) => { if (ox < 0 || oy < 0 || ox > maxX || oy > maxY) return; const s = sad(ox, oy, best); if (s < best){ best = s; bx = ox; by = oy; } };
    for (let dy = -R; dy <= R; dy += 2) for (let dx = -R; dx <= R; dx += 2) test(x0 + dx, y0 + dy);
    const cx = bx, cy = by;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) test(cx + dx, cy + dy);
    z.x = bx; z.y = by;
    // Le motif s'adapte doucement (lumière, angle)
    for (let j = 0; j < th; j++) for (let i = 0; i < tw; i++){
      const k = j * tw + i; tpl[k] = tpl[k] * 0.92 + GRAY[(by + j * st) * AW + bx + i * st] * 0.08;
    }
  }
}
function setSelecting(on){
  selecting = on; selA = selB = null;
  cv.style.touchAction = on ? 'none' : '';
  cv.style.cursor = on ? 'crosshair' : '';
  const b = $('#zSel'); if (b){ b.classList.toggle('on', on); b.innerHTML = on ? 'Trace sur<br>l’image' : 'Choisir<br>une zone'; }
  if (on) notify('Trace un rectangle sur l’image avec le doigt.');
  dirty = true;
}
function updateZoneUI(){
  const i = $('#zInfo'); if (!i) return;
  i.textContent = ZONES.length ? ZONES.length + ' zone' + (ZONES.length > 1 ? 's' : '') + ' choisie' + (ZONES.length > 1 ? 's' : '') + ' (6 maximum).' : 'Aucune zone : les fenêtres se placent toutes seules.';
  $('#zUndo').disabled = $('#zClear').disabled = !ZONES.length;
  refreshDeps();
}
function bindZones(){
  const pos = e => { const r = cv.getBoundingClientRect(); return [clamp((e.clientX - r.left) / r.width, 0, 1) * cv.width, clamp((e.clientY - r.top) / r.height, 0, 1) * cv.height]; };
  cv.addEventListener('pointerdown', e => {
    if (!selecting) return;
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_){}
    selA = selB = pos(e); dirty = true;
  });
  cv.addEventListener('pointermove', e => { if (selecting && selA){ selB = pos(e); dirty = true; } });
  const end = () => {
    if (!selecting || !selA) return;
    const x = Math.min(selA[0], selB[0]), y = Math.min(selA[1], selB[1]), w = Math.abs(selB[0] - selA[0]), h = Math.abs(selB[1] - selA[1]);
    const min = Math.min(cv.width, cv.height) * 0.03;
    if (w > min && h > min){ addZone(x, y, w, h); notify('Zone ajoutée.'); setSelecting(false); }
    else { selA = selB = null; dirty = true; }
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  $('#zSel').addEventListener('click', () => setSelecting(!selecting));
  $('#zUndo').addEventListener('click', () => { ZONES.pop(); updateZoneUI(); dirty = true; });
  $('#zClear').addEventListener('click', () => { ZONES = []; updateZoneUI(); dirty = true; });
  updateZoneUI();
}
// Aperçu du rectangle pendant le tracé
function drawSelection(u, pal){
  if (!selecting || !selA || !selB) return;
  const x = Math.min(selA[0], selB[0]), y = Math.min(selA[1], selB[1]), w = Math.abs(selB[0] - selA[0]), h = Math.abs(selB[1] - selA[1]);
  // Assombrit tout sauf la zone tracée
  const p = new Path2D(); p.rect(0, 0, cv.width, cv.height); p.rect(x, y, w, h);
  ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill(p, 'evenodd'); ctx.restore();
  ctx.setLineDash([4 * u, 3 * u]); ctx.lineWidth = Math.max(1, 1.5 * u); ctx.strokeStyle = pal.ligne; ctx.strokeRect(x, y, w, h); ctx.setLineDash([]);
}

/* ==========================================================
   17 bis. MIROIR BRISÉ ET VITRAIL
   ========================================================== */
let SHARDS = [], shardKey = '';

// Découpe en éclats : grille irrégulière de triangles et quadrilatères
function buildShards(W, H){
  const key = [S.vitre, S.vEclats, S.seed, W, H].join('|');
  if (key === shardKey) return;
  shardKey = key; SHARDS = [];
  const r = mulberry32(S.seed * 29 + 3);
  const add = pts => {
    let cx = 0, cy = 0, x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of pts){ cx += x; cy += y; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    const path = new Path2D(); pts.forEach(([x, y], k) => k ? path.lineTo(x, y) : path.moveTo(x, y)); path.closePath();
    SHARDS.push({ pts, path, cx: cx / pts.length, cy: cy / pts.length, x0, y0, x1, y1, h1: r(), h2: r(), h3: r() });
  };
  const cols = 3 + Math.round(S.vEclats / 100 * 13), cw = W / cols, rows = Math.max(2, Math.round(H / cw)), chh = H / rows;
  const V = [];
  for (let y = 0; y <= rows; y++){ const row = []; for (let x = 0; x <= cols; x++) row.push([x * cw + (x > 0 && x < cols ? (r() - 0.5) * 0.7 * cw : 0), y * chh + (y > 0 && y < rows ? (r() - 0.5) * 0.7 * chh : 0)]); V.push(row); }
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
    const a = V[y][x], b = V[y][x + 1], c = V[y + 1][x + 1], d = V[y + 1][x], t = r();
    if (t < 0.4){ add([a, b, c]); add([a, c, d]); }
    else if (t < 0.8){ add([a, b, d]); add([b, c, d]); }
    else add([a, b, c, d]);
  }
}

function drawGlass(W, H, u, pal, t, w, aBass, aBeat){
  buildShards(W, H);
  if (gCv.width !== W || gCv.height !== H){ gCv.width = W; gCv.height = H; }
  gCtx.drawImage(cv, 0, 0);
  const fis = S.vFissures / 100, refl = S.vReflets / 100, mv = S.mouvement;
  if (S.vitre === 'vitrail') return drawStained(W, H, u, fis, refl);

  let disp = S.vDecal / 100 * 28 * u * (1 + aBass * 0.6 + aBeat * 1.5);
  if (mv === 'pulsation') disp *= 0.5 + (0.5 + 0.5 * Math.sin(t * w * 1.6));
  const rotAmp = S.vDecal / 100 * 0.07;
  ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (const s of SHARDS){
    if (s.h1 > 0.965) continue;                                   // éclat tombé
    const a = s.h1 * 6.2832, m = disp * (0.3 + 0.7 * s.h2);
    const dx = Math.cos(a) * m, dy = Math.sin(a) * m + s.h3 * disp * 0.5;
    let rot = (s.h3 - 0.5) * 2 * rotAmp;
    if (mv === 'flux') rot += Math.sin(t * w + s.h1 * 6.28) * rotAmp * 0.8;
    const sc = 1 + (s.h2 - 0.5) * 0.06;
    ctx.save();
    ctx.translate(s.cx + dx, s.cy + dy); ctx.rotate(rot); ctx.scale(sc, sc); ctx.translate(-s.cx, -s.cy);
    ctx.clip(s.path);
    const bx = Math.max(0, Math.floor(s.x0) - 2), by = Math.max(0, Math.floor(s.y0) - 2);
    const bw = Math.min(W, Math.ceil(s.x1) + 2) - bx, bh = Math.min(H, Math.ceil(s.y1) + 2) - by;
    if (bw > 0 && bh > 0) ctx.drawImage(gCv, bx, by, bw, bh, bx, by, bw, bh);
    if (refl > 0 && s.h2 < refl * 0.8){
      const g = ctx.createLinearGradient(s.x0, s.y0, s.x1, s.y1), k = (0.08 + 0.25 * refl * s.h3).toFixed(3);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,' + k + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(bx, by, bw, bh);
    }
    if (fis > 0){ ctx.lineWidth = Math.max(1, 1.6 * u); ctx.strokeStyle = 'rgba(255,255,255,' + (0.55 * fis).toFixed(3) + ')'; ctx.stroke(s.path); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// Vitrail : chaque éclat est teinté de sa couleur dominante, cerné de plomb
function drawStained(W, H, u, fis, refl){
  const cw = 64, ch = Math.max(8, Math.round(64 * H / W));
  tCv.width = cw; tCv.height = ch; tCtx.drawImage(gCv, 0, 0, cw, ch);
  const d = tCtx.getImageData(0, 0, cw, ch).data, lead = new Path2D();
  for (const s of SHARDS){
    const j = (clamp((s.cy / H * ch) | 0, 0, ch - 1) * cw + clamp((s.cx / W * cw) | 0, 0, cw - 1)) * 4;
    const m = (d[j] + d[j + 1] + d[j + 2]) / 3;
    const c = [0, 1, 2].map(k => clamp(Math.round(m + (d[j + k] - m) * 2.2), 0, 255));
    const col = 'rgb(' + c.join(',') + ')';
    ctx.fillStyle = col;
    ctx.globalCompositeOperation = 'color'; ctx.globalAlpha = 0.85; ctx.fill(s.path);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 0.12 + 0.12 * s.h1; ctx.fill(s.path);
    if (refl > 0 && s.h2 < refl * 0.6){
      const g = ctx.createLinearGradient(s.x0, s.y0, s.x1, s.y1);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,' + (0.2 * refl).toFixed(3) + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fill(s.path);
    }
    lead.addPath(s.path);
  }
  ctx.globalAlpha = 1; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#0b0806'; ctx.lineWidth = (1.5 + fis * 5) * u; ctx.stroke(lead);
  ctx.strokeStyle = 'rgba(255,255,255,' + (0.1 + 0.2 * refl).toFixed(3) + ')'; ctx.lineWidth = Math.max(0.6, 0.7 * u); ctx.stroke(lead);
  ctx.lineJoin = 'miter';
}

/* ==========================================================
   17 ter. PRISME (séparation des couleurs, tranches glitch)
   ========================================================== */
function drawPrism(W, H, u, t, aBeat, anim){
  const f = S.pForce / 100, off = (2 + f * 18) * u * (1 + aBeat * 2);
  if (pCv.width !== W || pCv.height !== H){ pCv.width = W; pCv.height = H; }
  pCtx.drawImage(cv, 0, 0);
  ['#f00', '#0f0', '#00f'].forEach((col, k) => {
    const [c, g] = CHN[k];
    if (c.width !== W || c.height !== H){ c.width = W; c.height = H; }
    g.globalCompositeOperation = 'source-over'; g.drawImage(pCv, 0, 0);
    g.globalCompositeOperation = 'multiply'; g.fillStyle = col; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'source-over';
  });
  const ang = S.mouvement !== 'aucun' ? t * 0.8 : 0, dx = Math.cos(ang) * off, dy = Math.sin(ang) * off * 0.3;
  ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(CHN[0][0], dx, dy); ctx.drawImage(CHN[1][0], 0, 0); ctx.drawImage(CHN[2][0], -dx, -dy);
  ctx.globalCompositeOperation = 'source-over';
  if (S.prisme === 'tranches'){
    const r = mulberry32(S.seed * 17 + (anim ? ((frameNo / 3) | 0) : 0)), n = 4 + Math.round(f * 14);
    for (let k = 0; k < n; k++){
      const y = r() * H, h = (4 + r() * 40) * u, sx = (r() - 0.5) * W * 0.15 * f * (1 + aBeat);
      ctx.drawImage(cv, 0, y, W, h, sx, y, W, h);
    }
  }
}

/* ==========================================================
   18. GRILLE ET CHAÎNE DE CERCLES
   ========================================================== */
function drawGrid(W, H, u, pal){
  const a = S.gOpa / 100, lw = Math.max(0.6, 0.8 * u);
  ctx.lineWidth = lw; ctx.strokeStyle = pal.forme; ctx.fillStyle = pal.forme;
  ctx.font = Math.round(8 * u) + 'px ' + MONO(); ctx.textBaseline = 'top';
  if (S.grille === 'mesure'){
    const n = 4 + Math.round(S.gModules / 100 * 24), c = W / n, p = new Path2D(), t = new Path2D();
    for (let x = c; x < W - 1; x += c){ p.moveTo(x, 0); p.lineTo(x, H); }
    for (let y = c; y < H - 1; y += c){ p.moveTo(0, y); p.lineTo(W, y); }
    for (let x = 0; x < W; x += c / 4){ const l = (Math.round(x / (c / 4)) % 4 === 0 ? 10 : 5) * u; t.moveTo(x, 0); t.lineTo(x, l); }
    for (let y = 0; y < H; y += c / 4){ const l = (Math.round(y / (c / 4)) % 4 === 0 ? 10 : 5) * u; t.moveTo(0, y); t.lineTo(l, y); }
    ctx.lineWidth = Math.max(1, u); ctx.globalAlpha = a * 0.8; ctx.stroke(p);
    ctx.globalAlpha = a; ctx.stroke(t);
    for (let k = 1; k * c < W; k += 2) ctx.fillText(String(k).padStart(2, '0'), k * c + 3 * u, 12 * u);
    ctx.globalAlpha = 1; return;
  }
  const g = 2 * u, p = new Path2D();
  GRECTS.forEach((r, k) => {
    const x = r[0] * W + g, y = r[1] * H + g, w = r[2] * W - 2 * g, h = r[3] * H - 2 * g;
    if (w < 2 || h < 2) return;
    const hh = hash2(S.seed + 21, r[5]);
    if (S.grille === 'fragments' && hh < 0.3){
      const dx = (hash2(S.seed + 22, r[5]) - 0.5) * w * 0.35, dy = (hash2(S.seed + 23, r[5]) - 0.5) * h * 0.2;
      ctx.globalAlpha = 1; drawSourceRect(ctx, x + dx, y + dy, w, h, x, y, w, h);
    } else if (S.grille === 'editoriale' && hh < 0.18){
      ctx.globalAlpha = a * 0.8; ctx.fillStyle = pal.fond; ctx.fillRect(x, y, w, h); ctx.fillStyle = pal.forme;
    }
    p.rect(x, y, w, h);
    if (w > W * 0.16 && h > 18 * u){ ctx.globalAlpha = a; ctx.fillText(String.fromCharCode(65 + (k % 26)) + '-' + String(k).padStart(2, '0'), x + 4 * u, y + 4 * u); }
  });
  ctx.globalAlpha = a * 0.75; ctx.stroke(p); ctx.globalAlpha = 1;
}

function drawChain(W, H, u, pal, k){
  if (!heroIdx.length) return;
  const N = 3 + Math.round(S.cNb / 100 * 12), base = (36 + S.cRayon / 100 * 284) * u * (1 + AU.bass * 0.25 * k) * (S.mouvement === 'pulsation' ? 1 + 0.12 * Math.sin(performance.now() / 1000 * (0.4 + S.vitesse / 100 * 3.2) * 1.6) : 1);
  const ratio = 0.55 + S.cRatio / 100 * 0.53, ang0 = S.cAngle / 100 * Math.PI * 2;
  const circ = new Path2D(), cross = new Path2D(), chord = new Path2D(), labels = [];
  const dens = (x, y) => {
    if (!MAG) return 0;
    const ax = clamp(Math.round(x / W * AW), 1, AW - 2), ay = clamp(Math.round(y / H * AH), 1, AH - 2);
    return MAG[ay * AW + ax];
  };
  heroIdx.slice(0, 2).forEach((i, n) => {
    if (i < 0 || i >= nP) return;
    let a = ang0 + n * Math.PI * 0.75, x = QX[i], y = QY[i];
    // On part du côté le plus vide
    const ux = Math.cos(a), uy = Math.sin(a);
    let r = base, cx = x, cy = y;
    const C = [];
    for (let s = 0; s < N; s++){
      C.push([cx, cy, r]);
      circ.moveTo(cx + r, cy); circ.arc(cx, cy, r, 0, 6.2832);
      const r2 = r * ratio, d = (r + r2) * 0.62;
      cx += ux * d; cy += uy * d; r = r2;
      if (r < 3 * u) break;
    }
    // Intersections des cercles voisins
    for (let s = 0; s + 1 < C.length; s++){
      const [x1, y1, r1] = C[s], [x2, y2, r2] = C[s + 1], dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy);
      if (d > r1 + r2 || d < Math.abs(r1 - r2) || d === 0) continue;
      const aa = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - aa * aa));
      const mx = x1 + aa * dx / d, my = y1 + aa * dy / d, px = -dy / d * h, py = dx / d * h;
      const P = [[mx + px, my + py], [mx - px, my - py]], q = 3.5 * u;
      chord.moveTo(P[0][0], P[0][1]); chord.lineTo(P[1][0], P[1][1]);
      P.forEach(([X, Y]) => { cross.moveTo(X - q, Y); cross.lineTo(X + q, Y); cross.moveTo(X, Y - q); cross.lineTo(X, Y + q); });
      if (s < 3) labels.push([P[0][0], P[0][1]]);

  ctx.globalAlpha = 0.35; ctx.stroke(chord);
  ctx.strokeStyle = pal.ligne; ctx.globalAlpha = 0.95; ctx.stroke(cross);
  ctx.fillStyle = pal.ligne; ctx.font = Math.round(8.5 * u) + 'px ' + MONO(); ctx.textBaseline = 'bottom';
  labels.forEach(([x, y]) => ctx.fillText(pad4(x) + ' ' + pad4(y), x + 6 * u, y - 4 * u));
  ctx.globalAlpha = 1;
}

/* ==========================================================
   19. FORMES
   ========================================================== */
function addShape(p, type, x, y, r, tx, ty){
  switch (type){
    case 0: p.moveTo(x + r, y); p.arc(x, y, r, 0, 6.2832); break;
    case 1: { const s = r * 0.75; p.rect(x - s, y - s, s * 2, s * 2); break; }
    case 2: p.moveTo(x, y - r); p.lineTo(x + r, y); p.lineTo(x, y + r); p.lineTo(x - r, y); p.closePath(); break;
    case 3: {
      const nx = -ty, ny = tx, q = r * 0.6;
      p.moveTo(x - tx * r, y - ty * r); p.lineTo(x + tx * r, y + ty * r);
      p.moveTo(x - nx * q, y - ny * q); p.lineTo(x + nx * q, y + ny * q); break;
    }
    case 4: {
      const nx = -ty, ny = tx, h = r * 0.75, l = r * 0.4;
      for (let s = -1; s <= 1; s += 2){
        const bx = x + tx * r * s, by = y + ty * r * s;
        p.moveTo(bx + nx * h - tx * l * s, by + ny * h - ty * l * s);
        p.lineTo(bx + nx * h, by + ny * h); p.lineTo(bx - nx * h, by - ny * h);
        p.lineTo(bx - nx * h - tx * l * s, by - ny * h - ty * l * s);
      }
      break;
    }
    case 5: p.moveTo(x + r * 0.45, y); p.arc(x, y, r * 0.45, 0, 6.2832); break;
  }
}
const FIXED = { cercle: 0, carre: 1, losange: 2, croix: 3, crochets: 4 };

/* ==========================================================
   20. RENDU COMPLET D'UNE FRAME
   ========================================================== */
let frameNo = 0;
function render(now){
  const W = cv.width, H = cv.height, pal = PALETTES[S.palette];
  const u = Math.max(W, H) / 1200, kx = W / AW, ky = H / AH;
  const anim = src.type === 'video' || S.mouvement !== 'aucun' || exporting || AU.playing;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  frameNo++;
  updateAudio();
  const k = S.sonForce / 100 * 1.4;                 // force de la réaction au son
  const aBass = AU.bass * k, aMid = AU.mid * k, aHigh = AU.high * k, aBeat = AU.beat * k;

  if (holding){ ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); drawSource(ctx, W, H); return; }

  // 1. Fond, dither, mémoire
  if (src.type === 'image'){ ensureBase(W, H, pal); ctx.drawImage(baseCv, 0, 0); }
  else drawBase(ctx, W, H, pal, true);
  if (S.dither !== 'aucun') drawDither(W, H, u, pal, src.type === 'video');
  if (S.memoire === 'echo') drawEcho(W, H, u, anim);
  if (S.memoire === 'archive' || S.memoire === 'glyphes'){
    updateMemory(W, H, u, pal, anim);
    ctx.globalAlpha = S.mOpa / 100; ctx.globalCompositeOperation = BLEND[S.mFusion] || 'source-over';
    ctx.drawImage(mCv, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  const t = now / 1000, w = 0.4 + S.vitesse / 100 * 3.2, mv = S.mouvement, thr = threshold();
  const lw = (0.25 + S.epaisseur * 0.035) * u * (1 + aMid * 0.6);

  // 1 bis. Vitre et prisme
  if (S.vitre !== 'aucune') drawGlass(W, H, u, pal, t, w, aBass, aBeat);
  if (S.prisme !== 'aucun') drawPrism(W, H, u, t, aBeat, anim);

  // 2. Grille
  if (S.grille !== 'aucune') drawGrid(W, H, u, pal);

  // 3. Contours lumineux
  if (S.contours > 0 && (CSEG[0].length || CSEG[1].length)){
    const key = contVer + '|' + W + 'x' + H;
    if (key !== contKey){
      contPaths = CSEG.map(arr => { const p = new Path2D(); for (let i = 0; i < arr.length; i += 4){ p.moveTo(arr[i] * kx, arr[i + 1] * ky); p.lineTo(arr[i + 2] * kx, arr[i + 3] * ky); } return p; });
      contKey = key;
    }
    ctx.lineWidth = Math.max(0.6, 0.85 * u); ctx.lineCap = 'round';
    const a = Math.min(1, S.contours / 100 * (1 + aMid * 0.5));
    ctx.globalAlpha = a * 0.85; ctx.strokeStyle = pal.forme; ctx.stroke(contPaths[0]);
    ctx.globalAlpha = a; ctx.strokeStyle = pal.ligne; ctx.stroke(contPaths[1]);
    ctx.globalAlpha = 1;
  }

  // 4. Positions
  const amp = G.cs * 0.6;
  for (let i = 0; i < nP; i++){
    let x = PX[i], y = PY[i];
    if (mv === 'flux'){ const a = Math.sin(t * w + hash2(S.seed, PC[i]) * 6.2832) * amp; x += PTX[i] * a; y += PTY[i] * a; }
    QX[i] = x * kx; QY[i] = y * ky;
  }

  // 5. Liens
  if (nE){
    const pf = new Path2D(), pl = new Path2D();
    for (let e = 0; e < nE; e++){
      const a = E[2 * e], b = E[2 * e + 1];
      const p = (PL[a] >= 0.99 && PL[b] >= 0.99) ? pf : pl;
      p.moveTo(QX[a], QY[a]); p.lineTo(QX[b], QY[b]);
    }
    ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.strokeStyle = pal.ligne;
    ctx.globalAlpha = Math.min(1, 0.6 + aMid * 0.4); ctx.stroke(pf);
    ctx.globalAlpha = 0.22; ctx.stroke(pl);
    ctx.globalAlpha = 1;
  }

  // 6. Personnes (maillage du visage, squelette)
  if (S.personne !== 'aucun') drawPerson(W, H, u, pal, 1);

  // 7. Cercles d'ancrage
  const annot = S.annot === 'oui';
  if (annot && heroIdx.length){
    const p = new Path2D(), q = new Path2D(), L = Math.max(W, H);
    heroIdx.forEach((i, n) => {
      if (i < 0 || i >= nP) return;
      const x = QX[i], y = QY[i], h = hash2(S.seed + 3, PC[i]);
      const R = (0.06 + h * 0.13) * L * (1 + aBeat * 0.12) * (mv === 'pulsation' ? 1 + 0.15 * Math.sin(t * w + n * 1.3) : 1);
      p.moveTo(x + R, y); p.arc(x, y, R, 0, 6.2832);
      if (n % 2 === 0){ const r2 = R * 0.618; p.moveTo(x + r2, y); p.arc(x, y, r2, 0, 6.2832); }
      for (let s = 0; s < 4; s++){
        const a = s * Math.PI / 2 + h * 3;
        q.moveTo(x + Math.cos(a) * (R - 5 * u), y + Math.sin(a) * (R - 5 * u));
        q.lineTo(x + Math.cos(a) * (R + 5 * u), y + Math.sin(a) * (R + 5 * u));
      }
    });
    ctx.lineWidth = Math.max(0.6, 0.8 * u); ctx.strokeStyle = pal.forme;
    ctx.globalAlpha = 0.3; ctx.stroke(p);
    ctx.globalAlpha = 0.7; ctx.strokeStyle = pal.ligne; ctx.stroke(q);
    ctx.globalAlpha = 1;
  }

  // 8. Chaîne de cercles
  if (S.chaine === 'oui') drawChain(W, H, u, pal, k);

  // 9. Balayage (mouvement)
  let scanY = 0; const band = H * 0.07, scan = mv === 'balayage';
  if (scan){
    scanY = (((t * w * 0.12) % 1.2) - 0.1) * H;
    const gr = ctx.createLinearGradient(0, scanY - band, 0, scanY + band);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.5, pal.ligne); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.16; ctx.fillStyle = gr; ctx.fillRect(0, scanY - band, W, band * 2);
    ctx.globalAlpha = 0.9; ctx.fillStyle = pal.forme; ctx.fillRect(0, scanY - lw / 2, W, Math.max(1, lw));
    ctx.globalAlpha = 1;
  }

  // 10. Formes (petit / moyen / héros), gonflées par les basses
  const paths = new Array(24).fill(null);
  const rb = (0.8 + S.taille * 0.06) * u * (1 + aBass * 0.5 + aBeat * 0.35), mul = [1, 1.8, 3.2], fixed = FIXED[S.forme];
  for (let i = 0; i < nP; i++){
    const tier = TIER[i];
    let type;
    if (fixed !== undefined) type = fixed;
    else type = tier === 2 ? 4 : tier === 1 ? [1, 2, 3][(hash2(S.seed + 7, PC[i]) * 3) | 0] : 5;
    let r = rb * mul[tier], full = PL[i] >= 0.99;
    if (mv === 'pulsation') r *= Math.max(0.15, 1 + 0.9 * Math.sin(t * w * 1.6 + hash2(S.seed, PC[i]) * 6.2832));
    if (scan){ const b = 1 - Math.abs(QY[i] - scanY) / band; if (b > 0){ r *= 1 + 1.4 * b; full = true; } }

  for (let kk = 0; kk < 24; kk++){
    if (!paths[kk]) continue;
    const col = kk >= 12 ? pal.ligne : pal.forme;      // formes moyennes : couleur de la palette
    ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.globalAlpha = kk % 2 ? 0.35 : 0.95;
    if (((kk % 12) >> 1) === 5) ctx.fill(paths[kk]); else ctx.stroke(paths[kk]);
  }
  ctx.globalAlpha = 1;

  // 11. Coordonnées des héros
  if (annot && heroIdx.length){
    ctx.font = Math.round(9.5 * u) + 'px ' + MONO(); ctx.textBaseline = 'bottom'; ctx.fillStyle = pal.forme; ctx.globalAlpha = 0.85;
    for (const i of heroIdx){
      if (i < 0 || i >= nP) continue;
      ctx.fillText(pad4(QX[i]) + ' ' + pad4(QY[i]), Math.min(QX[i] + 9 * u, W - 70 * u), Math.max(QY[i] - 7 * u, 14 * u));
    }
    ctx.globalAlpha = 1;
  }

  // 12. Fenêtres mémoire
  if (S.memoire !== 'aucune') drawWindows(W, H, u, pal, t, w, aBass, anim);

  // 13. Trame et grain (les aigus les renforcent)
  if (S.lignes > 0){ ctx.globalAlpha = Math.min(1, S.lignes / 100 * 0.45 + aHigh * 0.25); ctx.fillStyle = scanPattern(u); ctx.fillRect(0, 0, W, H); }
  if (S.grain > 0 && grainPat){
    const ox = anim ? (hash2(S.seed, frameNo) * 160) | 0 : 0, oy = anim ? (hash2(frameNo, S.seed) * 160) | 0 : 0;
    ctx.globalAlpha = Math.min(1, S.grain / 100 * 0.6 + aHigh * 0.2);
    ctx.translate(ox, oy); ctx.fillStyle = grainPat; ctx.fillRect(-ox, -oy, W, H);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  ctx.globalAlpha = 1;

  // 14. Cadre
  if (S.cadre === 'oui') drawFrame(W, H, u, pal);

  // 15. Aperçu de la zone en cours de tracé

}

function drawFrame(W, H, u, pal){
  const m = 22 * u, l = 18 * u, fs = Math.round(9 * u);
  ctx.strokeStyle = pal.forme; ctx.fillStyle = pal.forme; ctx.lineWidth = Math.max(0.8, u);
  ctx.globalAlpha = 0.75;
  const p = new Path2D();
  p.moveTo(m, m + l); p.lineTo(m, m); p.lineTo(m + l, m);
  p.moveTo(W - m - l, m); p.lineTo(W - m, m); p.lineTo(W - m, m + l);
  p.moveTo(m, H - m - l); p.lineTo(m, H - m); p.lineTo(m + l, H - m);
  p.moveTo(W - m - l, H - m); p.lineTo(W - m, H - m); p.lineTo(W - m, H - m - l);
  ctx.stroke(p);
  ctx.font = fs + 'px ' + MONO(); ctx.textBaseline = 'bottom';
  ctx.textAlign = 'left';
  ctx.fillText('GÉOMÉTRIQUE / ' + (STYLES[S.style] ? STYLES[S.style].nom : '').toUpperCase(), m + 6 * u, H - m - 6 * u);
  ctx.textAlign = 'right';
  ctx.fillText(String(S.seed).padStart(5, '0') + ' / ' + nP + ' POINTS / ' + nE + ' LIENS', W - m - 6 * u, H - m - 6 * u);
  ctx.textAlign = 'left'; ctx.globalAlpha = 1;
}

/* ==========================================================
   21. BOUCLE PRINCIPALE
   ========================================================== */
let lastVT = -1, vidFrames = 0, slow = false, fpsN = 0, fpsT = 0, fps = 0;
function loop(now){
  requestAnimationFrame(loop);
  if (!src.el) return;
  let draw = dirty || S.mouvement !== 'aucun' || exporting || AU.playing;

  if (src.type === 'video'){
    const v = src.el;
    if (v.readyState >= 2 && v.currentTime !== lastVT){
      lastVT = v.currentTime; vidFrames++;
      if (!slow || vidFrames % 2 === 0 || needPts || needCont){
        const t0 = performance.now();
        analyzeFrame();
        trackZones();
        if (personActive() && modelsReady() && (vidFrames % 2 === 0 || v.paused)) runDetection();
        computePoints(!v.paused);
        if (S.contours > 0 || needCont) computeContours();
        if (needGrid || (S.grille !== 'aucune' && vidFrames % 30 === 1)) computeGrid();
        slow = performance.now() - t0 > 26;
      }
      draw = true;
    } else if ((needPts || needCont || needGrid) && MAG){
      if (needPts) computePoints(false);
      if (needCont) computeContours();
      if (needGrid) computeGrid();
      draw = true;
    }
  } else {
    if (needPts) computePoints(false);
    if (needCont) computeContours();
    if (needGrid) computeGrid();
  }

  if (!draw) return;
  render(now);
  dirty = false;
  fpsN++;
  if (now - fpsT > 500){ fps = Math.round(fpsN * 1000 / (now - fpsT)); fpsN = 0; fpsT = now; updateTele(); }
}
function updateTele(){
  $('#tSize').textContent = cv.width + '×' + cv.height;
  $('#tPts').textContent = nP;
  $('#tLinks').textContent = nE;
  $('#tFps').textContent = (src.type === 'video' || S.mouvement !== 'aucun' || AU.playing) ? fps : '-';
  $('#tSeed').textContent = String(S.seed).padStart(5, '0');
}

/* ==========================================================
   22. CHARGEMENT DES FICHIERS
   ========================================================== */
let msgTimer = 0;
function notify(text, err){
  const m = $('#msg'); m.textContent = text; m.classList.toggle('err', !!err);
  clearTimeout(msgTimer); msgTimer = setTimeout(() => { m.textContent = ''; }, 6000);
}
function releaseOld(){
  if (src.type === 'video' && src.el){ src.el.pause(); src.el.remove(); }
  if (src.url) URL.revokeObjectURL(src.url);
}
function setSource(type, el, w, h, url){
  releaseOld();
  src = { type, el, w, h, id: src.id + 1, url };
  const isV = type === 'video';
  $('#bPlay').hidden = !isV;
  $('#actions').classList.toggle('novid', !isV);
  prepareSource();
  updateTele();
}
function loadFile(file){
  if (!file || exporting) return;
  const t = file.type || '', name = file.name || '';
  if (t.startsWith('audio/') || /\.(mp3|wav|m4a|aac)$/i.test(name)) return loadAudio(file);
  const isVideo = t.startsWith('video/') || /\.(mp4|mov|webm)$/i.test(name);
  const isImage = t.startsWith('image/') || /\.(jpe?g|png|webp)$/i.test(name);
  if (isVideo){
    if (file.size > 100 * 1024 * 1024) return notify('Vidéo trop lourde : 100 Mo maximum.', true);
    loadVideo(file);
  } else if (isImage) loadImage(file);
  else notify('Format non pris en charge. Utilise JPG, PNG, WEBP, MP4, MOV, WEBM ou MP3.', true);
}
function loadImage(file){
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => { setSource('image', img, img.naturalWidth, img.naturalHeight, url); notify('Image chargée.'); };
  img.onerror = () => { URL.revokeObjectURL(url); notify('Impossible de lire cette image.', true); };
  img.src = url;
}
function loadVideo(file){
  const url = URL.createObjectURL(file), v = document.createElement('video');
  v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
  v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
  v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
  let ok = false, rejected = false;
  v.onloadedmetadata = () => {
    if (isFinite(v.duration) && v.duration > 15.05){
      rejected = true; v.removeAttribute('src'); v.load(); v.remove(); URL.revokeObjectURL(url);
      notify('Vidéo trop longue : 15 secondes maximum.', true);
    }
  };
  v.onloadeddata = () => {
    if (ok || rejected || !v.videoWidth) return; ok = true;
    setSource('video', v, v.videoWidth, v.videoHeight, url);
    v.play().then(() => { $('#bPlay').textContent = 'Pause'; }).catch(() => { $('#bPlay').textContent = 'Lecture'; });
    notify('Vidéo chargée.');
  };
  v.onerror = () => { if (ok || rejected) return; v.remove(); URL.revokeObjectURL(url); notify('Ce navigateur ne lit pas cette vidéo. Essaie MP4.', true); };
  document.body.appendChild(v);
  v.src = url;
}

/* ==========================================================
   23. ENREGISTREMENT
   ========================================================== */
const dlReady = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);

async function saveFile(blob, name){
  const dl = await dlReady;
  if (dl){
    try { await dl.save({ filename: name, data: blob }); notify('Fichier enregistré.'); }
    catch (e){
      const code = e && e.code;
      if (code === 'declined') notify('Enregistrement annulé.');
      else if (code === 'rate_limited') notify('Une demande est déjà ouverte. Réessaie dans un instant.', true);
      else if (code === 'too_large') notify('Fichier trop lourd. Choisis une durée plus courte.', true);
      else notify("L'enregistrement n'est pas disponible ici.", true);
    }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

   24. EXPORT PNG ET VIDÉO (avec le son si demandé)

function exportPng(){

}
const canRecord = !!(window.MediaRecorder && HTMLCanvasElement.prototype.captureStream);
function pickMime(withAudio){
  if (!canRecord) return null;
  const list = withAudio
    ? ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm']
    : ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  for (const m of list){ try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e){} }
  return null;
}

async function exportVideo(){
  const withAudio = !!(AU.el && AU.dest && S.sonVideo === 'oui');
  const mime = pickMime(withAudio);
  if (exporting || !src.el || !mime) return;
  exporting = true; holding = false;
  const bVid = $('#bVid'), prog = $('#prog'), bar = $('#progBar');
  setExportUI(true);
  const pw = cv.width, ph = cv.height;
  if (cv.width > 1080){ const s = 1080 / cv.width; cv.width = 1080; cv.height = even(ph * s); }
  dirty = true;
  if (src.type === 'video'){ try { src.el.currentTime = 0; await src.el.play(); $('#bPlay').textContent = 'Pause'; } catch (e){} }
  if (withAudio){ AU.el.currentTime = 0; await playAudio(true); }

  let rec, stream, tick = 0;
  const chunks = [];
  try {
    stream = cv.captureStream(30);
    if (withAudio) AU.dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
  } catch (e){ finish(); notify("L'export vidéo a échoué sur ce navigateur.", true); return; }
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => { rec.onstop = r; });
  const dur = S.duree * 1000, t0 = performance.now();
  prog.hidden = false; bar.style.width = '0%';
  tick = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / dur);
    bar.style.width = (k * 100).toFixed(1) + '%';
    bVid.textContent = 'Enregistrement ' + Math.ceil(k * 100) + ' %';
  }, 100);
  rec.start();
  await new Promise(r => setTimeout(r, dur));
  rec.stop();
  await stopped;
  stream.getVideoTracks().forEach(tr => tr.stop());
  finish();
  if (!chunks.length) return notify("L'export vidéo n'a rien produit. Réessaie.", true);
  const type = mime.split(';')[0], ext = type.includes('mp4') ? 'mp4' : 'webm';
  await saveFile(new Blob(chunks, { type }), 'geometrique-' + S.seed + '-' + S.duree + 's.' + ext);

  function finish(){
    clearInterval(tick);
    exporting = false;
    cv.width = pw; cv.height = ph; baseKey = dKey = mKey = contKey = ''; dirty = true;
    prog.hidden = true; bVid.textContent = 'Exporter vidéo';
    setExportUI(false);
  }
}

function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

function buildSeg(it){
  const box = el('div', 'ctl'); box.id = 'c-' + it.seg;
  box.appendChild(el('div', 'head', '<span>' + it.label + '</span>'));
  const seg = el('div', 'seg'); seg.setAttribute('role', 'radiogroup'); seg.setAttribute('aria-label', it.label);
  seg.style.gridTemplateColumns = 'repeat(' + it.cols + ',1fr)';
  for (const [v, txt] of it.opts){
    const lab = el('label', 'opt');
    const ic = it.icons ? '<svg class="shp" viewBox="0 0 24 24" aria-hidden="true">' + SHAPE_ICONS[v] + '</svg>' : '';
    const sw = it.swatch ? '<i class="sw" style="background:' + PALETTES[v].fond + ';border-color:' + PALETTES[v].ligne + '"></i>' : ic;
    lab.innerHTML = '<input type="radio" name="' + it.seg + '" value="' + v + '"><span' + (it.icons ? ' class="ico"' : '') + '>' + sw + txt + '</span>';
    seg.appendChild(lab);
  }
  box.appendChild(seg);
  return box;
}
function buildRange(it){
  const k = it.range, min = it.min ?? 1; RANGE_MIN[k] = min;

  box.innerHTML = '<div class="head"><label for="r-' + k + '">' + it.label + '</label><output id="o-' + k + '" for="r-' + k + '"></output></div>' +

function buildPanel(){
  const root = $('#panes'), rail = $('#rail');
  SECTIONS.forEach((sec, n) => {
    const pane = el('div', 'pane'); pane.id = 'pane-' + sec.key; pane.hidden = true;
    pane.setAttribute('role', 'tabpanel');
    for (const it of sec.items){
      let node;
      if (it.html) node = el('div', null, it.html);
      else if (it.note) node = el('p', 'note', it.note);
      else if (it.sub) node = el('h3', 'sub', it.sub);
      else node = it.seg ? buildSeg(it) : buildRange(it);
      const off = it.dep ? (it.dep[0] === '@audio' ? () => !AU.el : () => S[it.dep[0]] === it.dep[1]) : null;
      if (off || it.only) DEPS.push([node, off, it.only || null]);
      pane.appendChild(node);
    }
    root.appendChild(pane);
    if (sec.badge) BADGES[sec.key] = sec.badge;
    // Bouton du menu : uniquement l'icône
    const b = el('button', 'ri', '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[sec.key] || '') + '</svg><i class="dot"></i>');

  }
}

let curSec = -1, railTimer = 0, railRaf = 0;
function goTo(n, scroll){
  n = clamp(n, 0, SECTIONS.length - 1);
  const rail = $('#rail'), items = rail.children;
  if (scroll){
    const it = items[n];
    rail.scrollTo({ left: it.offsetLeft - (rail.clientWidth - it.offsetWidth) / 2, behavior: 'smooth' });
  }
  if (n === curSec) return;
  curSec = n;
  SECTIONS.forEach((sec, k) => {
    $('#pane-' + sec.key).hidden = k !== n;
    items[k].classList.toggle('cur', k === n);
    items[k].setAttribute('aria-selected', String(k === n));
    items[k].tabIndex = k === n ? 0 : -1;
  });
  $('#paneTitle').textContent = SECTIONS[n].t;
  refreshDeps();
  // Sur téléphone : le nouveau réglage commence juste sous l'image
  if (scroll !== null && !matchMedia('(min-width:900px)').matches){
    const top = $('.panel').getBoundingClientRect().top + scrollY - $('.stage').offsetHeight;
    if (scrollY > top) scrollTo({ top, behavior: 'smooth' });
  }
}
function railCenter(){
  const rail = $('#rail'), mid = rail.scrollLeft + rail.clientWidth / 2;
  let best = 0, bd = Infinity;
  [...rail.children].forEach((it, k) => {
    const c = it.offsetLeft + it.offsetWidth / 2, dd = Math.abs(c - mid);
    if (dd < bd){ bd = dd; best = k; }
    // Effet loupe : l'icône centrale grossit, les autres s'effacent
    const t = Math.min(1, dd / 160);
    it.style.transform = 'scale(' + (1.25 - t * 0.45).toFixed(3) + ')';
    it.style.opacity = (1 - t * 0.6).toFixed(3);
  });
  return best;
}
function bindRail(){
  const rail = $('#rail');
  // Hauteur de la zone fixe, pour que rien ne passe dessous
  const setH = () => document.documentElement.style.setProperty('--stageH', (matchMedia('(min-width:900px)').matches ? 0 : $('.stage').offsetHeight) + 'px');
  setH(); if ('ResizeObserver' in window) new ResizeObserver(setH).observe($('.stage'));
  rail.addEventListener('scroll', () => {
    if (!railRaf) railRaf = requestAnimationFrame(() => { railRaf = 0; railCenter(); });
    clearTimeout(railTimer);
    railTimer = setTimeout(() => goTo(railCenter(), false), 90);
  }, { passive: true });
  rail.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight'){ e.preventDefault(); goTo(curSec + 1, true); rail.children[curSec].focus(); }
    if (e.key === 'ArrowLeft'){ e.preventDefault(); goTo(curSec - 1, true); rail.children[curSec].focus(); }
  });
  window.addEventListener('resize', () => goTo(curSec, true));
  goTo(0, false);
  requestAnimationFrame(() => { goTo(0, true); railCenter(); });
}

// Grise les réglages dont la couche est éteinte
function refreshDeps(){
  for (const [node, off, only] of DEPS){
    const hide = only ? !only() : false, o = off ? off() : false;
    node.classList.toggle('hide', hide);
    node.classList.toggle('off', o);
    node.querySelectorAll('input').forEach(i => { i.disabled = o; });
  }
  const label = { liens: S.liens, contours: S.contours > 0 ? 'oui' : 'non', personnes: S.personne, dither: S.dither, memoire: S.memoire, vitre: S.vitre, prisme: S.prisme, grille: S.grille, cercles: S.chaine, mouvement: S.mouvement };
  const live = { liens: S.liens !== 'aucun', contours: S.contours > 0, personnes: S.personne !== 'aucun' || S.protege !== 'non', dither: S.dither !== 'aucun', memoire: S.memoire !== 'aucune', vitre: S.vitre !== 'aucune', prisme: S.prisme !== 'aucun', grille: S.grille !== 'aucune', cercles: S.chaine === 'oui', mouvement: S.mouvement !== 'aucun', son: !!AU.el };
  const rail = $('#rail');
  SECTIONS.forEach((sec, k) => { if (rail.children[k]) rail.children[k].classList.toggle('live', !!live[sec.key]); });
  const sec = SECTIONS[curSec];
  if (sec) $('#paneBadge').textContent = sec.key in label ? String(label[sec.key]).toUpperCase() : '';
}
function syncUI(){
  document.querySelectorAll('input[type=range]').forEach(r => { r.value = S[r.name]; paintRange(r); });
  document.querySelectorAll('input[type=radio]').forEach(r => { r.checked = String(S[r.name]) === r.value; });
  document.querySelectorAll('#styles .btn').forEach(b => b.classList.toggle('cur', b.dataset.style === S.style));
  applyPalette(); refreshDeps();
}
function paintRange(r){
  const min = +r.min;
  r.style.setProperty('--p', ((r.value - min) / (100 - min) * 100) + '%');
  const v = +r.value, OUT = {
    mNiveaux: () => v >= 100 ? 'MAX' : String(2 + Math.round(v / 100 * 14)),
    mFen: () => String(Math.round(v / 100 * 16)),
    mZoom: () => '×' + (1 + v / 100 * 3).toFixed(1),
    cAngle: () => Math.round(v * 3.6) + '°'
  };
  $('#o-' + r.name).textContent = OUT[r.name] ? OUT[r.name]() : String(v).padStart(3, '0');
}
function applyPalette(){
  const p = PALETTES[S.palette];
  document.documentElement.style.setProperty('--acc', p.ligne);
  document.documentElement.style.setProperty('--on-acc', p.fond);
}

function onInput(e){
  const t = e.target; if (!t.name) return;
  const k = t.name;
  if (t.type === 'range'){ S[k] = +t.value; paintRange(t); }
  else if (t.type === 'radio'){
    const v = k === 'duree' ? +t.value : t.value;
    if (S[k] === v) return;
    S[k] = v;
  } else return;
  if (POINT_KEYS.includes(k)) needPts = true;
  if (CONTOUR_KEYS.includes(k)) needCont = true;
  if (GRID_KEYS.includes(k)) needGrid = true;
  if (k === 'mFenForme' && S.memoire === 'aucune'){ S.memoire = 'fenetres'; syncUI(); }
  if ((k === 'memoire' || k === 'mFenForme') && S.memoire === 'fenetres' && S.mFen === 0 && !ZONES.length){ S.mFen = 30; S.mAuto = 'oui'; syncUI(); }
  if (k === 'format') prepareSource();
  if (k === 'palette') applyPalette();
  if (PERSON_KEYS.includes(k)) onPersonChange();
  refreshDeps();
  dirty = true;
}
function onPersonChange(){
  if (!personActive()){ resetPerson(); needPts = true; return; }
  if (src.type === 'image') detectStill();
  else ensureModels();
  buildWeights(); needPts = true;
}

function applyStyle(k){
  Object.assign(S, LAYERS_OFF, STYLES[k].v); S.style = k;
  syncUI();
  needPts = needCont = needGrid = true; dirty = true;
}
function randomize(){
  S.seed = 1 + Math.floor(Math.random() * 99999);
  const r = mulberry32(S.seed);
  for (const k of ['densite', 'seuil', 'taille', 'distance', 'epaisseur', 'opacite', 'lignes', 'grain']){
    S[k] = Math.round(clamp(S[k] + (r() * 2 - 1) * 12, RANGE_MIN[k], 100));
  }
  if (S.contours > 0) S.niveaux = Math.round(clamp(S.niveaux + (r() * 2 - 1) * 15, 1, 100));
  if (S.chaine === 'oui') S.cAngle = Math.round(r() * 100);
  makeGrain(); syncUI();
  HERO = []; needPts = needCont = needGrid = true; dirty = true; updateTele();
}

/* ==========================================================
   26. AJUSTEMENT DU CANVAS À L'ÉCRAN
   ========================================================== */
function fitCanvas(){
  const f = $('#frame').getBoundingClientRect(), pad = 20;
  const s = Math.max(0.01, Math.min((f.width - pad) / cv.width, (f.height - pad) / cv.height));
  const wrap = $('#wrap');
  wrap.style.width = Math.floor(cv.width * s) + 'px';
  wrap.style.height = Math.floor(cv.height * s) + 'px';
}

/* ==========================================================
   27. ÉVÉNEMENTS
   ========================================================== */
function bindEvents(){
  const file = $('#file'), afile = $('#audioFile');
  $('#bLoad').addEventListener('click', () => file.click());
  file.addEventListener('change', () => { loadFile(file.files[0]); file.value = ''; });
  $('#aLoad').addEventListener('click', () => afile.click());
  afile.addEventListener('change', () => { loadAudio(afile.files[0]); afile.value = ''; });
  $('#aPlay').addEventListener('click', () => playAudio(!AU.playing));
  $('#aDel').addEventListener('click', () => removeAudio(false));

  let depth = 0;
  window.addEventListener('dragenter', e => { e.preventDefault(); depth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', e => { e.preventDefault(); if (--depth <= 0){ depth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault(); depth = 0; document.body.classList.remove('dragging');
    if (e.dataTransfer && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  document.addEventListener('input', onInput);
  document.addEventListener('change', onInput);
  $('#bRand').addEventListener('click', randomize);

  const hold = $('#bHold');
  const on = e => { e.preventDefault(); holding = true; dirty = true; hold.classList.add('on'); };
  const off = () => { if (!holding) return; holding = false; dirty = true; hold.classList.remove('on'); };
  hold.addEventListener('pointerdown', e => { if (hold.setPointerCapture) try { hold.setPointerCapture(e.pointerId); } catch (_){} on(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture', 'blur'].forEach(ev => hold.addEventListener(ev, off));
  hold.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) on(e); });
  hold.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') off(); });
  hold.addEventListener('contextmenu', e => e.preventDefault());

  $('#bPlay').addEventListener('click', () => {
    const v = src.el; if (src.type !== 'video') return;
    if (v.paused) v.play().then(() => { $('#bPlay').textContent = 'Pause'; }).catch(() => notify('Lecture impossible.', true));
    else { v.pause(); $('#bPlay').textContent = 'Lecture'; }
  });
  $('#bPng').addEventListener('click', exportPng);
  $('#bVid').addEventListener('click', exportVideo);
  if ('ResizeObserver' in window) new ResizeObserver(fitCanvas).observe($('#frame'));
  else window.addEventListener('resize', fitCanvas);
}

/* ==========================================================
   28. DÉMARRAGE
   ========================================================== */
function init(){
  buildPanel(); bindEvents(); bindRail(); bindZones(); syncUI(); makeGrain(); updateAudioUI();
  if (!canRecord){
    $('#bVid').disabled = true;
    const n = $('#vidNote'); n.hidden = false;
    n.textContent = "Ton navigateur ne permet pas l'export vidéo. Essaie un Chrome ou un Safari récent.";
  }
  const demo = makeDemo();
  setSource('image', demo, demo.width, demo.height, null);
  requestAnimationFrame(loop);
}
init();
</script>
