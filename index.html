<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Géométrique</title>
<style>
/* ===== Jetons de style ===== */
:root{
  --bg:#0a1014; --bg2:#0e161b; --rule:#1b2830; --rule2:#2a3a44;
  --txt:#d3dee3; --dim:#6f858e; --acc:#5fd6d2; --on-acc:#0b1418;
  --mono:ui-monospace,"SF Mono","SFMono-Regular","JetBrains Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--stageH,0px) + 8px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 var(--mono);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ===== En-tête ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.brand b{display:block;font-size:15px;letter-spacing:.3em;font-weight:700}
.brand span{display:block;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ===== Scène ===== */
.stage{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);padding:10px 12px 8px}
.frame{position:relative;height:36vh;height:36dvh;display:grid;place-items:center;background-color:var(--bg2);
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:24px 24px;background-position:-1px -1px}
.wrap{position:relative}
#cv{display:block;width:100%;height:100%;touch-action:manipulation}
.reg{position:absolute;width:10px;height:10px;border:0 solid var(--acc);pointer-events:none}
.reg.a{top:-5px;left:-5px;border-width:1px 0 0 1px}.reg.b{top:-5px;right:-5px;border-width:1px 1px 0 0}
.reg.c{bottom:-5px;left:-5px;border-width:0 0 1px 1px}.reg.d{bottom:-5px;right:-5px;border-width:0 1px 1px 0}
.tele{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;margin-top:8px;font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.tele b{color:var(--txt);font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.actions.novid{grid-template-columns:repeat(2,1fr)}
.msg{font-size:11px;color:var(--acc);margin:6px 0 0}
.msg.err{color:#ff8a7a}
.msg:empty{display:none}

/* ===== Boutons ===== */
.btn{min-height:48px;padding:0 12px;border:1px solid var(--rule2);background:transparent;text-transform:uppercase;letter-spacing:.1em;font-size:11px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;border-radius:0;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.btn small{font-size:9px;letter-spacing:.06em;opacity:.65;text-transform:none}
.btn:active,.btn.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn.primary{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:700}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn[hidden]{display:none}
.btn.sm{min-height:40px;padding:0 14px}

/* ===== Panneau ===== */
.panel{padding:0 12px 32px}
.block{border-bottom:1px solid var(--rule);padding:14px 0}
h2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:0 0 10px;font-weight:600}
details.sec{border-bottom:1px solid var(--rule)}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:50px;cursor:pointer;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .badge{margin-left:auto;color:var(--dim);font-weight:400;letter-spacing:.08em}
details.sec>summary::after{content:'+';font-size:16px;width:14px;text-align:center}
details.sec[open]>summary::after{content:'−'}
details.sec .body{padding:0 0 10px}
.ctl{margin:6px 0 12px}
.head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.head output{color:var(--dim);font-variant-numeric:tabular-nums}
.ctl.off{opacity:.35}
.seg{display:grid;gap:6px;margin-top:8px}
.opt{position:relative;display:block}
.opt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 6px;border:1px solid var(--rule2);
  font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.opt input:checked+span{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.opt input:disabled+span{opacity:.35}
.sw{flex:none;width:16px;height:16px;border:2px solid}
.styles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.styles .btn{min-height:52px;font-size:10px}
.styles .btn.cur{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0 6px}
.progress{height:3px;background:var(--rule);margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--acc)}
.note{font-size:10px;color:var(--dim);letter-spacing:.04em;margin:10px 0 0}
.audio-name{font-size:11px;color:var(--txt);margin:6px 0 0;word-break:break-all}
.toggle{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0;background:none;border:0;border-bottom:1px solid var(--rule);
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt);cursor:pointer}
.toggle span{font-size:16px;color:var(--acc)}
#settings[hidden]{display:none}

/* ===== Menu à icônes (défilement horizontal) ===== */
.rail-wrap{position:relative;margin-top:8px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.rail{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px calc(50% - 28px);scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.ri{flex:none;width:56px;height:56px;display:grid;place-items:center;scroll-snap-align:center;border:0;background:none;color:var(--dim);cursor:pointer;position:relative;padding:0;
  will-change:transform;-webkit-tap-highlight-color:transparent}
.ri svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ri.cur{color:var(--acc)}
.ri .dot{position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;background:var(--acc);opacity:0}
.ri.live .dot{opacity:1}
.lens{position:absolute;left:50%;top:4px;width:56px;height:56px;margin-left:-28px;pointer-events:none}
.lens i{position:absolute;width:9px;height:9px;border:0 solid var(--acc)}
.lens i:nth-child(1){top:0;left:0;border-width:1px 0 0 1px}.lens i:nth-child(2){top:0;right:0;border-width:1px 1px 0 0}
.lens i:nth-child(3){bottom:0;left:0;border-width:0 0 1px 1px}.lens i:nth-child(4){bottom:0;right:0;border-width:0 1px 1px 0}
.pane-head{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0 4px;border-bottom:1px solid var(--rule)}
.pane-head h2{margin:0}
.pane-head .badge{font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.pane{padding:6px 0 10px}
.pane[hidden]{display:none}
.sub{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);font-weight:500;margin:18px 0 2px;padding-top:12px;border-top:1px dashed var(--rule)}
.ctl.hide,.sub.hide,.note.hide{display:none}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 4px}
.chips .btn{min-height:40px;font-size:10px}

/* ===== Curseurs ===== */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;margin:2px 0 0;background:transparent;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--acc) 0 var(--p),var(--rule2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-10px;background:var(--bg);border:2px solid var(--acc);border-radius:0}
input[type=range]::-moz-range-track{height:2px;background:linear-gradient(90deg,var(--acc) 0 var(--p),var(--rule2) var(--p))}
input[type=range]::-moz-range-thumb{width:18px;height:18px;background:var(--bg);border:2px solid var(--acc);border-radius:0}
input[type=range]:disabled{cursor:not-allowed}

/* ===== Glisser-déposer ===== */
.drop{position:fixed;inset:12px;display:none;place-items:center;background:rgba(6,12,15,.88);border:1px dashed var(--acc);z-index:50;
  text-transform:uppercase;letter-spacing:.2em;font-size:12px;color:var(--acc)}
body.dragging .drop{display:grid}

/* ===== Ordinateur : réglages à côté ===== */
.opt span.ico{flex-direction:column;gap:3px;min-height:60px;font-size:10px}
.opt span.ico .shp{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linejoin:round}
@media (max-width:899px){
  .tele{display:none}
  .frame{height:32vh;height:32dvh}
  .actions .btn{min-height:42px}
  .rail-wrap{margin-top:4px}
}
@media (min-width:900px){
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  .main{display:grid;grid-template-columns:minmax(0,1fr) 400px;align-items:start}
  .stage{height:calc(100vh - 58px);height:calc(100dvh - 58px);display:flex;flex-direction:column;border-bottom:0;border-right:1px solid var(--rule);padding:14px}
  .frame{flex:1;height:auto;min-height:0}
  .panel{padding:0 18px 40px}
  .toggle{display:none}
  #settings[hidden]{display:block}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>GÉOMÉTRIQUE</b><span>Photo ou vidéo en plan géométrique</span></div>
  <button class="btn sm" id="bLoad" type="button">Charger</button>
  <input id="file" class="hidden-input" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm,.mov">
  <input id="audioFile" class="hidden-input" type="file" accept="audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/mp4,audio/x-m4a,audio/aac,.mp3,.wav,.m4a">
</header>

<main class="main">
  <section class="stage" aria-label="Aperçu">
    <div class="frame" id="frame">
      <div class="wrap" id="wrap">
        <canvas id="cv" width="960" height="1200" aria-label="Rendu géométrique"></canvas>
        <i class="reg a"></i><i class="reg b"></i><i class="reg c"></i><i class="reg d"></i>
      </div>
    </div>
    <div class="tele">
      <span>Taille<b id="tSize">-</b></span><span>Points<b id="tPts">0</b></span><span>Liens<b id="tLinks">0</b></span>
      <span>I/S<b id="tFps">-</b></span><span>Seed<b id="tSeed">-</b></span>
    </div>
    <div class="actions novid" id="actions">
      <button class="btn" id="bRand" type="button">Aléatoire</button>
      <button class="btn" id="bHold" type="button">Original<small>maintenir</small></button>
      <button class="btn" id="bPlay" type="button" hidden>Pause</button>
    </div>
    <nav class="rail-wrap" aria-label="Menu des réglages">
      <div class="rail" id="rail" role="tablist" aria-label="Réglages"></div>
      <div class="lens" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </nav>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </section>

  <section class="panel">
    <div class="pane-head"><h2 id="paneTitle">Style</h2><span class="badge" id="paneBadge"></span></div>
    <div id="panes"></div>
  </section>
</main>
<div class="drop" aria-hidden="true">Dépose ton image, ta vidéo ou ton son</div>

<script>
'use strict';

/* ==========================================================
   1. OUTILS
   ========================================================== */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const even = v => Math.max(2, Math.round(v / 2) * 2);
const pad4 = n => String(Math.max(0, Math.round(n))).padStart(4, '0');
let monoCache = '';
const MONO = () => monoCache || (monoCache = getComputedStyle(document.documentElement).getPropertyValue('--mono').trim() || 'monospace');

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(a, b){
  let h = Math.imul((a | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(((b | 0) + 0x632be5ab) | 0, 0xc2b2ae35);
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d);
  h ^= h >>> 12; h = Math.imul(h, 0x297a2d39);
  h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}
function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

/* ==========================================================
   2. RÉGLAGES, PALETTES, STYLES
   ========================================================== */
const S = {
  densite: 55, seuil: 22, taille: 30, distance: 45, epaisseur: 15,
  opacite: 88, contours: 0, niveaux: 35, lignes: 40, grain: 12, vitesse: 40,
  couleur: 'nb', forme: 'mixte', liens: 'contour', palette: 'cyan', mouvement: 'aucun',
  annot: 'oui', cadre: 'oui', format: 'original', duree: 5, seed: 1207, style: 'constellation',
  // Personnes
  personne: 'aucun', protege: 'non',
  // Dither
  dither: 'aucun', dGrain: 25, dSeuil: 50, dOpa: 85, dFusion: 'normal',
  // Pixel memory
  memoire: 'aucune', mRendu: 'bloc', mCell: 30, mRatio: 50, mEcart: 0, mEntropie: 0,
  mCible: 'clairs', mSeuil: 50, mCouv: 45, mPrio: 30,
  mCouleur: 'photo', mNiveaux: 100, mContraste: 50, mAccent: 35, mSep: 45,
  mDecal: 0, mRefresh: 40, mEchoLong: 60, mEchoDir: 'horizontal',
  mFen: 30, mFenTaille: 40, mFenVar: 40, mZoom: 35, mFenForme: 'mixte', mFenPlace: 'proche', mFenCible: 'forts', mFenPix: 0, mFenTon: 'photo', mLien: 'coude', mLienEp: 35, mFenRepere: 'oui', mFenLabel: 'oui', mFenCadre: 'oui', mAuto: 'oui', mSuivi: 'oui', mOpa: 100, mFusion: 'normal',
  // Vitre
  vitre: 'aucune', vEclats: 45, vDecal: 40, vFissures: 70, vReflets: 40,
  // Prisme
  prisme: 'aucun', pForce: 40,
  // Grille
  grille: 'aucune', gModules: 40, gOpa: 55,
  // Chaîne de cercles
  chaine: 'non', cNb: 40, cAngle: 30, cRayon: 35, cRatio: 55,
  // Son
  sonForce: 60, sonVideo: 'oui'
};

const PALETTES = {
  cyan:    { nom: 'Cyan archive', fond: '#0b1418', ligne: '#5fd6d2', forme: '#eefaf9' },
  cobalt:  { nom: 'Cobalt',       fond: '#0a1030', ligne: '#5b82ff', forme: '#eef2ff' },
  rouge:   { nom: 'Rouge signal', fond: '#140909', ligne: '#ff4a38', forme: '#fff1ed' },
  mono:    { nom: 'Monochrome',   fond: '#111111', ligne: '#c4c4c4', forme: '#ffffff' },
  solaire: { nom: 'Solaire',      fond: '#15130c', ligne: '#f3d54e', forme: '#fffbea' }
};

// Les styles éteignent les couches spéciales sauf celles qu'ils allument
// Préréglages Pixel memory (complets : chaque réglage est défini)
const MEM_BASE = { memoire: 'fenetres', mRendu: 'bloc', mCell: 30, mRatio: 50, mEcart: 0, mEntropie: 0, mCible: 'clairs', mSeuil: 50, mCouv: 45, mPrio: 30,
  mCouleur: 'photo', mNiveaux: 100, mContraste: 50, mAccent: 35, mSep: 45, mDecal: 0, mRefresh: 40, mEchoLong: 60, mEchoDir: 'horizontal',
  mFen: 30, mFenTaille: 40, mFenVar: 40, mZoom: 35, mFenForme: 'mixte', mFenPlace: 'proche', mFenCible: 'forts', mFenPix: 0, mFenTon: 'photo', mLien: 'coude', mLienEp: 35, mFenRepere: 'oui', mFenLabel: 'oui', mFenCadre: 'oui', mAuto: 'oui', mSuivi: 'oui', mOpa: 100, mFusion: 'normal' };
const MEM_PRESETS = {
  zoom:      { nom: 'Zoom',      v: { mFen: 38, mFenTaille: 45, mFenVar: 40, mZoom: 35 } },
  planche:   { nom: 'Planche',   v: { mFen: 63, mFenTaille: 35, mFenVar: 0, mZoom: 50, mFenForme: 'carre', mFenPlace: 'bord', mLien: 'droit', mLienEp: 15 } },
  pixel:     { nom: 'Pixel',     v: { mFen: 44, mFenTaille: 55, mFenVar: 50, mZoom: 25, mFenPix: 55, mFenTon: 'nb', mFenPlace: 'libre' } },
  blocs:     { nom: 'Blocs',     v: { memoire: 'archive', mCell: 55, mCible: 'tout', mCouv: 30, mSep: 60, mAccent: 50, mFen: 32, mZoom: 40 } },
  corrompue: { nom: 'Corrompue', v: { memoire: 'archive', mCell: 40, mRatio: 70, mCible: 'tout', mCouv: 55, mDecal: 60, mEntropie: 25, mEcart: 8, mNiveaux: 20, mRefresh: 70, mSep: 30, mFen: 25 } },
  echo:      { nom: 'Écho',      v: { memoire: 'echo', mCell: 25, mCouv: 50, mEchoLong: 70, mFen: 19 } }
};
const memPreset = k => Object.assign({}, MEM_BASE, MEM_PRESETS[k].v);

const LAYERS_OFF = { dither: 'aucun', memoire: 'aucune', grille: 'aucune', chaine: 'non', contours: 0, vitre: 'aucune', prisme: 'aucun' };
const STYLES = {
  constellation: { nom: 'Constellation', v: { couleur: 'nb', opacite: 88, densite: 55, seuil: 22, liens: 'contour', distance: 45, epaisseur: 15, forme: 'mixte', taille: 30, lignes: 40, grain: 12, annot: 'oui', cadre: 'oui', palette: 'cyan' } },
  atlas: { nom: 'Atlas des contours', v: { couleur: 'original', opacite: 100, contours: 70, niveaux: 45, densite: 20, seuil: 35, liens: 'aucun', distance: 30, epaisseur: 10, forme: 'cercle', taille: 10, lignes: 0, grain: 6, annot: 'non', cadre: 'non', palette: 'solaire' } },
  plan: { nom: 'Plan technique', v: { couleur: 'teinte', opacite: 45, contours: 25, niveaux: 25, densite: 65, seuil: 20, liens: 'delaunay', distance: 35, epaisseur: 18, forme: 'crochets', taille: 34, lignes: 25, grain: 10, annot: 'oui', cadre: 'oui', palette: 'cobalt', grille: 'mesure', gModules: 45, gOpa: 35 } },
  radial: { nom: 'Spécimen radial', v: { couleur: 'nb', opacite: 80, densite: 45, seuil: 24, liens: 'delaunay', distance: 30, epaisseur: 12, forme: 'mixte', taille: 26, lignes: 20, grain: 10, annot: 'oui', cadre: 'oui', palette: 'rouge', chaine: 'oui', cNb: 45, cAngle: 30, cRayon: 35, cRatio: 60 } },
  dither: { nom: 'Dither cobalt', v: { couleur: 'nb', opacite: 100, densite: 35, seuil: 26, liens: 'contour', distance: 40, epaisseur: 14, forme: 'mixte', taille: 26, lignes: 10, grain: 0, annot: 'oui', cadre: 'oui', palette: 'cobalt', dither: 'atkinson', dGrain: 22, dSeuil: 50, dOpa: 100, dFusion: 'normal' } },
  memoireZoom: { nom: 'Mémoire zoom', v: Object.assign(memPreset('zoom'), { couleur: 'original', opacite: 100, densite: 30, seuil: 26, liens: 'contour', distance: 35, epaisseur: 10, forme: 'mixte', taille: 22, lignes: 10, grain: 6, annot: 'non', cadre: 'oui', palette: 'mono' }) },
  planche: { nom: 'Planche contact', v: Object.assign(memPreset('planche'), { couleur: 'nb', opacite: 90, densite: 30, seuil: 26, liens: 'contour', distance: 35, epaisseur: 10, forme: 'mixte', taille: 22, lignes: 25, grain: 10, annot: 'non', cadre: 'oui', palette: 'cyan' }) },

/* ==========================================================

function cropRect(sw, sh, fmt){
  const r = { original: sw / sh, '4:5': 4 / 5, '9:16': 9 / 16, '1:1': 1 }[fmt];
  let w = sw, h = sh;
  if (sw / sh > r) w = sh * r; else h = sw / r;
  return { x: (sw - w) / 2, y: (sh - h) / 2, w, h };
}

function prepareSource(){
  if (!src.el) return;
  const isV = src.type === 'video';
  crop = cropRect(src.w, src.h, S.format);
  const sa = Math.min(1, (isV ? 540 : 1200) / Math.max(crop.w, crop.h));
  AW = Math.max(8, Math.round(crop.w * sa));
  AH = Math.max(8, Math.round(crop.h * sa));
  anaCv.width = AW; anaCv.height = AH;

  let W, H;
  if (isV){ const s = Math.min(1080 / crop.w, 1920 / crop.h); W = crop.w * s; H = crop.h * s; }
  else { W = AW; H = AH; }
  cv.width = even(W); cv.height = even(H);
  fitCanvas();

  G.cols = -1; HERO = []; resetPerson();
  ZONES = []; setSelecting(false); if ($('#zInfo')) updateZoneUI();
  if (!isV){
    srcCv.width = cv.width; srcCv.height = cv.height;
    srcCtx.drawImage(src.el, crop.x, crop.y, crop.w, crop.h, 0, 0, srcCv.width, srcCv.height);
    anaCtx.drawImage(srcCv, 0, 0, AW, AH);
    computeSobel();
    computePoints(false);
    computeContours();
    computeGrid();
    if (personActive()) detectStill();
  } else {
    MAG = null; nP = 0; nE = 0; lastVT = -1; CSEG[0].length = CSEG[1].length = 0; contVer++; GRECTS = [];
    if (personActive()) ensureModels();
  }
  baseKey = dKey = mKey = '';
  dirty = true;
}

function drawSource(c, W, H){
  if (src.type === 'video') c.drawImage(src.el, crop.x, crop.y, crop.w, crop.h, 0, 0, W, H);
  else c.drawImage(srcCv, 0, 0, W, H);
}
// Copie une zone de la source (coordonnées du canvas de rendu) vers une autre zone
function drawSourceRect(c, x, y, w, h, dx, dy, dw, dh){
  const W = cv.width, H = cv.height;
  x = clamp(x, 0, W - 1); y = clamp(y, 0, H - 1);
  w = Math.max(1, Math.min(w, W - x)); h = Math.max(1, Math.min(h, H - y));
  if (src.type === 'video'){
    const kx = crop.w / W, ky = crop.h / H;
    c.drawImage(src.el, crop.x + x * kx, crop.y + y * ky, w * kx, h * ky, dx, dy, dw, dh);
  } else {
    const f = srcCv.width / W;
    c.drawImage(srcCv, x * f, y * f, Math.min(w * f, srcCv.width - x * f), Math.min(h * f, srcCv.height - y * f), dx, dy, dw, dh);
  }
}

/* ==========================================================
   6. NIVEAUX DE GRIS + SOBEL
   ========================================================== */
function computeSobel(){
  const d = anaCtx.getImageData(0, 0, AW, AH).data, n = AW * AH, w = AW;
  if (!GRAY || !MAG || GRAY.length !== n){
    GRAY = new Float32Array(n); MAG = new Float32Array(n);
    GXA = new Float32Array(n); GYA = new Float32Array(n);
  }
  const g = GRAY;
  for (let i = 0, j = 0; i < n; i++, j += 4) g[i] = d[j] * 0.299 + d[j + 1] * 0.587 + d[j + 2] * 0.114;
  for (let y = 1; y < AH - 1; y++){
    let i = y * w + 1;
    for (let x = 1; x < w - 1; x++, i++){
      const a = g[i - w - 1], b = g[i - w], c = g[i - w + 1];
      const l = g[i - 1], r = g[i + 1];
      const f = g[i + w - 1], h = g[i + w], k = g[i + w + 1];
      const gx = (c + 2 * r + k) - (a + 2 * l + f);
      const gy = (f + 2 * h + k) - (a + 2 * b + c);
      GXA[i] = gx; GYA[i] = gy;
      MAG[i] = Math.sqrt(gx * gx + gy * gy) * (1 / 1020);
    }
  }
}
function analyzeFrame(){
  anaCtx.drawImage(src.el, crop.x, crop.y, crop.w, crop.h, 0, 0, AW, AH);
  computeSobel();
}

/* ==========================================================
   7. POINTS + LISSAGE + HIÉRARCHIE
   ========================================================== */
function ensureGrid(){
  const target = 100 + S.densite * S.densite * 0.3;
  const cs = Math.max(3, Math.sqrt(AW * AH / target));
  const cols = Math.ceil(AW / cs), rows = Math.ceil(AH / cs);
  if (cols === G.cols && rows === G.rows && G.w === AW && G.h === AH) return;
  G = { cs, cols, rows, n: cols * rows, w: AW, h: AH };
  const n = G.n;
  BEST = new Float32Array(n); BI = new Int32Array(n);
  CX = new Float32Array(n); CY = new Float32Array(n);
  CTX = new Float32Array(n); CTY = new Float32Array(n);
  CST = new Float32Array(n); CL = new Float32Array(n);
  ORDER = new Int32Array(n); CELLPT = new Int32Array(n);
  COLOF = new Int32Array(AW); for (let x = 0; x < AW; x++) COLOF[x] = Math.min(cols - 1, (x / cs) | 0);
  ROWOF = new Int32Array(AH); for (let y = 0; y < AH; y++) ROWOF[y] = Math.min(rows - 1, (y / cs) | 0);
  HERO = [];
}

function computePoints(smooth){
  if (!MAG) return;
  ensureGrid();
  const thr = threshold(), w = AW, cols = G.cols, n = G.n, Wg = (WGT && WGT.length === AW * AH) ? WGT : null;
  BEST.fill(0); BI.fill(-1);
  for (let y = 1; y < AH - 1; y++){
    const base = ROWOF[y] * cols;
    let i = y * w + 1;
    for (let x = 1; x < w - 1; x++, i++){
      let m = MAG[i];
      if (Wg) m *= Wg[i];                       // masque silhouette / visage
      if (m > thr){ const c = base + COLOF[x]; if (m > BEST[c]){ BEST[c] = m; BI[c] = i; } }
    }
  }
  let cnt = 0;
  for (let c = 0; c < n; c++){
    const i = BI[c];
    if (i >= 0){
      const x = i % w, y = (i - x) / w;
      let tx = -GYA[i], ty = GXA[i];
      const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
      if (smooth && CL[c] > 0){
        if (tx * CTX[c] + ty * CTY[c] < 0){ tx = -tx; ty = -ty; }
        CX[c] += (x - CX[c]) * 0.5; CY[c] += (y - CY[c]) * 0.5;
        const nx = CTX[c] + (tx - CTX[c]) * 0.5, ny = CTY[c] + (ty - CTY[c]) * 0.5;
        const nl = Math.hypot(nx, ny) || 1; CTX[c] = nx / nl; CTY[c] = ny / nl;
        CST[c] += (BEST[c] - CST[c]) * 0.5;
        CL[c] = Math.min(1, CL[c] + 0.34);
      } else {
        CX[c] = x; CY[c] = y; CTX[c] = tx; CTY[c] = ty; CST[c] = BEST[c];
        CL[c] = smooth ? 0.34 : 1;
      }
    } else CL[c] = smooth ? Math.max(0, CL[c] - 0.25) : 0;
    if (CL[c] > 0) ORDER[cnt++] = c;
  }
  let list = ORDER.subarray(0, cnt);
  if (cnt > MAXP){ list = Array.from(list).sort((a, b) => CST[b] * CL[b] - CST[a] * CL[a]); cnt = MAXP; }
  nP = cnt;
  CELLPT.fill(-1);
  for (let k = 0; k < cnt; k++){
    const c = list[k];
    PX[k] = CX[c]; PY[k] = CY[c]; PTX[k] = CTX[c]; PTY[k] = CTY[c];
    PS[k] = CST[c]; PL[k] = CL[c]; PC[k] = c; CELLPT[c] = k;
  }
  if (nP){
    const sorted = Float32Array.from(PS.subarray(0, nP)).sort();
    const q75 = sorted[Math.floor(nP * 0.75)];
    for (let k = 0; k < nP; k++) TIER[k] = PS[k] >= q75 ? 1 : 0;
  }
  pickHeroes(!smooth);
  buildLinks(thr);
  needPts = false;
}

function pickHeroes(force){
  const K = clamp(Math.round(nP * 0.02), 3, 9);
  HERO = force ? [] : HERO.filter(c => c < CELLPT.length && CELLPT[c] >= 0 && PL[CELLPT[c]] > 0.5);
  if (HERO.length < K){
    const md = 0.15 * Math.max(AW, AH), md2 = md * md;
    const cand = Array.from({ length: nP }, (_, i) => i).sort((a, b) => PS[b] - PS[a]);
    for (const i of cand){
      if (HERO.length >= K) break;
      if (PL[i] < 0.99 || HERO.includes(PC[i])) continue;
      let ok = true;
      for (const c of HERO){
        const j = CELLPT[c], dx = PX[i] - PX[j], dy = PY[i] - PY[j];
        if (dx * dx + dy * dy < md2){ ok = false; break; }
      }
      if (ok) HERO.push(PC[i]);
    }
  }
  heroIdx = HERO.map(c => CELLPT[c]);
  for (const i of heroIdx) TIER[i] = 2;
}

/* ==========================================================
   8. DELAUNAY (Bowyer-Watson)
   ========================================================== */
function delaunay(xs, ys, n, out){
  if (n < 3) return 0;
  const X = new Float64Array(n + 3), Y = new Float64Array(n + 3);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (let i = 0; i < n; i++){
    X[i] = xs[i] + ((i * 7919) % 997) * 1e-6;
    Y[i] = ys[i] + ((i * 104729) % 991) * 1e-6;
    if (X[i] < minX) minX = X[i]; if (X[i] > maxX) maxX = X[i];
    if (Y[i] < minY) minY = Y[i]; if (Y[i] > maxY) maxY = Y[i];
  }
  const dm = Math.max(maxX - minX, maxY - minY, 1) * 20, mx = (minX + maxX) / 2, my = (minY + maxY) / 2;
  X[n] = mx - dm; Y[n] = my - dm; X[n + 1] = mx; Y[n + 1] = my + dm; X[n + 2] = mx + dm; Y[n + 2] = my - dm;
  const tri = (a, b, c) => {
    const ax = X[a], ay = Y[a], bx = X[b], by = Y[b], cx = X[c], cy = Y[c];
    const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
    if (Math.abs(d) < 1e-12) return { a, b, c, x: (ax + bx + cx) / 3, y: (ay + by + cy) / 3, r: Infinity };
    const a2 = ax * ax + ay * ay, b2 = bx * bx + by * by, c2 = cx * cx + cy * cy;
    const ux = (a2 * (by - cy) + b2 * (cy - ay) + c2 * (ay - by)) / d;
    const uy = (a2 * (cx - bx) + b2 * (ax - cx) + c2 * (bx - ax)) / d;
    return { a, b, c, x: ux, y: uy, r: (ax - ux) * (ax - ux) + (ay - uy) * (ay - uy) };
  };
  const order = Array.from({ length: n }, (_, i) => i).sort((p, q) => X[p] - X[q]);
  const open = [tri(n, n + 1, n + 2)], closed = [], ed = [];
  for (const i of order){
    const px = X[i], py = Y[i];
    ed.length = 0;
    for (let j = open.length - 1; j >= 0; j--){
      const t = open[j], dx = px - t.x;
      if (dx > 0 && dx * dx > t.r){ closed.push(t); open[j] = open[open.length - 1]; open.pop(); continue; }
      const dy = py - t.y;
      if (dx * dx + dy * dy <= t.r){ ed.push(t.a, t.b, t.b, t.c, t.c, t.a); open[j] = open[open.length - 1]; open.pop(); }
    }
    const m = ed.length;
    for (let a = 0; a < m; a += 2){
      if (ed[a] < 0) continue;
      for (let b = a + 2; b < m; b += 2){
        if (ed[b] < 0) continue;
        if ((ed[a] === ed[b] && ed[a + 1] === ed[b + 1]) || (ed[a] === ed[b + 1] && ed[a + 1] === ed[b])){
          ed[a] = ed[a + 1] = ed[b] = ed[b + 1] = -1; break;
        }
      }
    }
    for (let a = 0; a < m; a += 2) if (ed[a] >= 0) open.push(tri(ed[a], ed[a + 1], i));
  }
  const seen = new Set(); let k = 0;
  const add = (a, b) => { const key = a < b ? a * 4096 + b : b * 4096 + a; if (seen.has(key)) return; seen.add(key); out[k++] = a; out[k++] = b; };
  for (const list of [closed, open]) for (const t of list){
    if (t.a >= n || t.b >= n || t.c >= n) continue;
    add(t.a, t.b); add(t.b, t.c); add(t.c, t.a);
  }
  return k / 2;
}

/* ==========================================================
   9. LIENS
   ========================================================== */
function support(a, b){
  let s = 0;
  for (let k = 1; k <= 5; k++){
    const t = k / 6;
    const x = clamp(Math.round(PX[a] + (PX[b] - PX[a]) * t), 1, AW - 2);
    const y = clamp(Math.round(PY[a] + (PY[b] - PY[a]) * t), 1, AH - 2);
    const i = y * AW + x;
    s += Math.max(MAG[i], MAG[i - 1], MAG[i + 1], MAG[i - AW], MAG[i + AW]);
  }
  return s / 5;
}

function buildLinks(thr){
  nE = 0;
  if (S.liens === 'aucun' || nP < 2) return;
  const maxD = Math.max(1, S.distance / 100 * 0.25 * Math.max(AW, AH)), md2 = maxD * maxD;
  const conf = thr * 0.45;
  const push = (a, b) => { E[2 * nE] = a; E[2 * nE + 1] = b; nE++; };
  if (S.liens === 'delaunay'){
    const m = delaunay(PX, PY, nP, TMP);
    for (let e = 0; e < m; e++){
      const a = TMP[2 * e], b = TMP[2 * e + 1];
      const dx = PX[a] - PX[b], dy = PY[a] - PY[b];
      if (dx * dx + dy * dy > md2 || support(a, b) < conf) continue;
      push(a, b);
    }
    return;
  }
  const cs = maxD, cols = Math.ceil(AW / cs) + 1, rows = Math.ceil(AH / cs) + 1;
  const head = new Int32Array(cols * rows).fill(-1), next = new Int32Array(nP);
  for (let i = 0; i < nP; i++){ const c = ((PY[i] / cs) | 0) * cols + ((PX[i] / cs) | 0); next[i] = head[c]; head[c] = i; }
  const seen = new Set();
  const addPair = (i, j) => { const key = i < j ? i * 4096 + j : j * 4096 + i; if (seen.has(key)) return; seen.add(key); push(i, j); };
  const each = (i, fn) => {
    const gx = (PX[i] / cs) | 0, gy = (PY[i] / cs) | 0;
    for (let yy = Math.max(0, gy - 1); yy <= Math.min(rows - 1, gy + 1); yy++)
      for (let xx = Math.max(0, gx - 1); xx <= Math.min(cols - 1, gx + 1); xx++)
        for (let j = head[yy * cols + xx]; j >= 0; j = next[j]) if (j !== i) fn(j);
  };
  if (S.liens === 'contour'){
    for (let i = 0; i < nP; i++){
      let bf = -1, sf = 0.55, bb = -1, sb = 0.55;
      each(i, j => {
        const dx = PX[j] - PX[i], dy = PY[j] - PY[i], d2 = dx * dx + dy * dy;
        if (d2 > md2 || d2 < 1) return;
        const d = Math.sqrt(d2), ux = dx / d, uy = dy / d;
        const di = ux * PTX[i] + uy * PTY[i], dj = Math.abs(ux * PTX[j] + uy * PTY[j]);
        const sc = Math.abs(di) * dj - 0.25 * d / maxD;
        if (di > 0){ if (sc > sf){ sf = sc; bf = j; } } else if (sc > sb){ sb = sc; bb = j; }
      });
      if (bf >= 0 && support(i, bf) >= conf) addPair(i, bf);
      if (bb >= 0 && support(i, bb) >= conf) addPair(i, bb);
    }
    return;
  }
  const nb = [-1, -1, -1], nd = [0, 0, 0];
  for (let i = 0; i < nP; i++){
    nb[0] = nb[1] = nb[2] = -1; nd[0] = nd[1] = nd[2] = Infinity;
    each(i, j => {
      const dx = PX[i] - PX[j], dy = PY[i] - PY[j], d = dx * dx + dy * dy;
      if (d > md2 || d >= nd[2]) return;
      let s = 2;
      while (s > 0 && d < nd[s - 1]){ nd[s] = nd[s - 1]; nb[s] = nb[s - 1]; s--; }
      nd[s] = d; nb[s] = j;
    });
    for (let s = 0; s < 3; s++) if (nb[s] >= 0) addPair(i, nb[s]);
  }
}

/* ==========================================================
   10. CONTOURS LUMINEUX (marching squares)
   ========================================================== */
function boxBlur(a, w, h, r){
  const t = new Float32Array(a.length), inv = 1 / (2 * r + 1);
  for (let y = 0; y < h; y++){
    const o = y * w; let s = 0;
    for (let x = -r; x <= r; x++) s += a[o + clamp(x, 0, w - 1)];
    for (let x = 0; x < w; x++){ t[o + x] = s * inv; s += a[o + Math.min(w - 1, x + r + 1)] - a[o + Math.max(0, x - r)]; }
  }
  for (let x = 0; x < w; x++){
    let s = 0;
    for (let y = -r; y <= r; y++) s += t[clamp(y, 0, h - 1) * w + x];
    for (let y = 0; y < h; y++){ a[y * w + x] = s * inv; s += t[Math.min(h - 1, y + r + 1) * w + x] - t[Math.max(0, y - r) * w + x]; }
  }
}
function computeContours(){
  CSEG[0].length = CSEG[1].length = 0; contVer++; needCont = false;
  if (S.contours <= 0 || !GRAY) return;
  const st = AW * AH > 600000 ? 3 : AW * AH > 200000 ? 2 : 1;
  const gw = Math.floor((AW - 1) / st) + 1, gh = Math.floor((AH - 1) / st) + 1;
  const L = new Float32Array(gw * gh);
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) L[y * gw + x] = GRAY[(y * st) * AW + x * st];
  boxBlur(L, gw, gh, 2); boxBlur(L, gw, gh, 1);
  const N = 4 + Math.round(S.niveaux / 100 * 28), step = 255 / N;
  const A = CSEG[0], B = CSEG[1], MAXS = 480000;
  for (let y = 0; y < gh - 1; y++){
    for (let x = 0; x < gw - 1; x++){
      const i = y * gw + x;
      const a = L[i], b = L[i + 1], c = L[i + gw + 1], d = L[i + gw];
      const mn = Math.min(a, b, c, d), mx = Math.max(a, b, c, d);
      const k0 = Math.ceil(mn / step - 0.5), k1 = Math.floor(mx / step - 0.5);
      for (let k = k0; k <= k1; k++){
        const v = (k + 0.5) * step;
        const code = (a > v ? 8 : 0) | (b > v ? 4 : 0) | (c > v ? 2 : 0) | (d > v ? 1 : 0);
        if (code === 0 || code === 15) continue;
        const T = () => [x + (v - a) / (b - a), y], R = () => [x + 1, y + (v - b) / (c - b)];
        const Bo = () => [x + (v - d) / (c - d), y + 1], Le = () => [x, y + (v - a) / (d - a)];
        const out = (k & 1) ? B : A;
        const seg = (p, q) => { out.push(p[0] * st, p[1] * st, q[0] * st, q[1] * st); };
        switch (code){
          case 1: case 14: seg(Le(), Bo()); break;
          case 2: case 13: seg(Bo(), R()); break;
          case 3: case 12: seg(Le(), R()); break;
          case 4: case 11: seg(T(), R()); break;
          case 6: case 9: seg(T(), Bo()); break;
          case 7: case 8: seg(Le(), T()); break;
          case 5: seg(T(), R()); seg(Le(), Bo()); break;
          case 10: seg(Le(), T()); seg(Bo(), R()); break;
        }
      }
      if (A.length + B.length > MAXS) return;
    }
  }
}

/* ==========================================================
   11. GRILLE (découpage selon la densité de contours)
   Zones riches en détails : grandes cellules. Fond : petites cellules.
   ========================================================== */
function computeGrid(){
  GRECTS = []; needGrid = false;
  if (S.grille === 'aucune' || S.grille === 'mesure' || !MAG) return;
  const w = AW + 1, II = new Float64Array(w * (AH + 1));
  for (let y = 0; y < AH; y++){
    let row = 0;
    for (let x = 0; x < AW; x++){ row += MAG[y * AW + x]; II[(y + 1) * w + x + 1] = II[y * w + x + 1] + row; }
  }
  const sum = (x0, y0, x1, y1) => II[y1 * w + x1] - II[y0 * w + x1] - II[y1 * w + x0] + II[y0 * w + x0];
  const mean = sum(0, 0, AW, AH) / (AW * AH) || 1e-6;
  const maxD = 2 + Math.round(S.gModules / 100 * 6);
  const rnd = (a, b) => hash2(S.seed * 97 + a, b);
  (function rec(x, y, rw, rh, d, id){
    const x0 = Math.round(x * AW), y0 = Math.round(y * AH), x1 = Math.round((x + rw) * AW), y1 = Math.round((y + rh) * AH);
    const area = Math.max(1, (x1 - x0) * (y1 - y0));
    const dens = sum(x0, y0, x1, y1) / area / mean;
    let split = d < 2 || (d < maxD && rnd(d, id) < clamp(1.15 - dens * 0.45, 0.12, 0.95));
    if ((x1 - x0) < 28 || (y1 - y0) < 28) split = false;
    if (!split){ GRECTS.push([x, y, rw, rh, dens, id]); return; }
    const t = 0.35 + rnd(id, d + 9) * 0.3;
    if (rw * AW >= rh * AH){ rec(x, y, rw * t, rh, d + 1, id * 2 + 1); rec(x + rw * t, y, rw * (1 - t), rh, d + 1, id * 2 + 2); }
    else { rec(x, y, rw, rh * t, d + 1, id * 2 + 1); rec(x, y + rh * t, rw, rh * (1 - t), d + 1, id * 2 + 2); }
  })(0, 0, 1, 1, 0, 0);
}

/* ==========================================================
   12. DÉTECTION PERSONNES / VISAGES (MediaPipe, chargé à la demande)
   ========================================================== */
const MPURL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';
const MODELS = {
  seg: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite',
  face: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
  pose: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'
};
const MP = { vision: null, files: null, seg: null, face: null, pose: null, loading: null, ts: 0 };
let PMASK = null, PMW = 0, PMH = 0, FACES = [], POSES = [];

const personActive = () => S.personne !== 'aucun' || S.protege !== 'non';
const needSeg = () => S.personne === 'silhouette' || S.personne === 'complet';
const needFace = () => S.personne === 'visage' || S.personne === 'complet' || S.protege !== 'non';
const needPose = () => S.personne === 'squelette' || S.personne === 'complet';
const modelsReady = () => (!needSeg() || MP.seg) && (!needFace() || MP.face) && (!needPose() || MP.pose);

function resetPerson(){ PMASK = null; FACES = []; POSES = []; WGT = null; }

function ensureModels(){
  if (modelsReady()) return Promise.resolve(true);
  if (MP.loading) return MP.loading;
  MP.loading = (async () => {
    try {
      notify('Chargement du modèle de détection…');
      if (!MP.vision){
        MP.vision = await import(MPURL + '/vision_bundle.mjs');
        MP.files = await MP.vision.FilesetResolver.forVisionTasks(MPURL + '/wasm');
      }
      const V = MP.vision;
      const make = async (Cls, url, extra) => {
        const o = d => Object.assign({ baseOptions: { modelAssetPath: url, delegate: d }, runningMode: 'VIDEO' }, extra);
        try { return await Cls.createFromOptions(MP.files, o('GPU')); }
        catch (e){ return await Cls.createFromOptions(MP.files, o('CPU')); }
      };
      if (needSeg() && !MP.seg) MP.seg = await make(V.ImageSegmenter, MODELS.seg, { outputConfidenceMasks: true, outputCategoryMask: false });
      if (needFace() && !MP.face) MP.face = await make(V.FaceLandmarker, MODELS.face, { numFaces: 4 });
      if (needPose() && !MP.pose) MP.pose = await make(V.PoseLandmarker, MODELS.pose, { numPoses: 3 });
      notify('Détection prête.');
      return true;
    } catch (e){
      console.warn(e);
      S.personne = 'aucun'; S.protege = 'non'; syncUI();
      notify("Détection indisponible ici : elle demande Internet (version GitHub).", true);
      return false;
    } finally { MP.loading = null; }
  })();
  return MP.loading;
}

// Lance les modèles sur l'image d'analyse
function runDetection(){
  const ts = MP.ts = Math.max(performance.now(), MP.ts + 1);
  try {
    if (needSeg() && MP.seg){
      MP.seg.segmentForVideo(anaCv, ts, r => {
        const m = r.confidenceMasks && r.confidenceMasks[0];
        if (!m) return;
        const a = m.getAsFloat32Array();
        if (!PMASK || PMASK.length !== a.length) PMASK = new Float32Array(a.length);
        PMASK.set(a); PMW = m.width; PMH = m.height;
      });
    } else PMASK = null;
    FACES = (needFace() && MP.face) ? (MP.face.detectForVideo(anaCv, ts).faceLandmarks || []) : [];
    POSES = (needPose() && MP.pose) ? (MP.pose.detectForVideo(anaCv, ts).landmarks || []) : [];
  } catch (e){ console.warn(e); }
  buildWeights();
}

// Image fixe : détection unique, après chargement des modèles si besoin
function detectStill(){
  ensureModels().then(ok => {
    if (!ok || src.type !== 'image' || !personActive()) return;
    anaCtx.drawImage(srcCv, 0, 0, AW, AH);
    runDetection(); needPts = true; dirty = true;
  });
}

function hull(pts){
  pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts){ while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--){ const p = pts[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}

// Poids par pixel : 0 hors silhouette, réduit ou nul sur les visages protégés
function buildWeights(){
  const sil = needSeg() && PMASK, prot = S.protege !== 'non' && FACES.length;
  if (!sil && !prot){ WGT = null; return; }
  const n = AW * AH;
  if (!WGT || WGT.length !== n) WGT = new Float32Array(n);
  if (sil){
    const sx = PMW / AW, sy = PMH / AH;
    for (let y = 0; y < AH; y++){
      const row = ((y * sy) | 0) * PMW;
      for (let x = 0; x < AW; x++) WGT[y * AW + x] = PMASK[row + ((x * sx) | 0)] > 0.5 ? 1 : 0;
    }
  } else WGT.fill(1);
  if (prot){
    maskCv.width = AW; maskCv.height = AH;
    maskCtx.fillStyle = '#fff';
    for (const f of FACES){
      const h = hull(f.map(p => [p.x * AW, p.y * AH]));
      let cx = 0, cy = 0; h.forEach(p => { cx += p[0]; cy += p[1]; }); cx /= h.length; cy /= h.length;
      maskCtx.beginPath();
      h.forEach((p, i) => { const x = cx + (p[0] - cx) * 1.12, y = cy + (p[1] - cy) * 1.12; i ? maskCtx.lineTo(x, y) : maskCtx.moveTo(x, y); });
      maskCtx.closePath(); maskCtx.fill();
    }
    const d = maskCtx.getImageData(0, 0, AW, AH).data, f = S.protege === 'exclure' ? 0 : 0.3;
    for (let i = 0; i < n; i++) if (d[i * 4 + 3] > 127) WGT[i] *= f;
  }
}

function drawPerson(W, H, u, pal, k){
  if (!MP.vision) return;
  if ((S.personne === 'visage' || S.personne === 'complet') && FACES.length){
    const C = MP.vision.FaceLandmarker.FACE_LANDMARKS_TESSELATION, p = new Path2D(), q = new Path2D();
    for (const f of FACES){
      for (const c of C){ const a = f[c.start], b = f[c.end]; if (a && b){ p.moveTo(a.x * W, a.y * H); p.lineTo(b.x * W, b.y * H); } }
      for (let i = 0; i < f.length; i += 9){ const x = f[i].x * W, y = f[i].y * H; q.moveTo(x + 1.2 * u, y); q.arc(x, y, 1.2 * u, 0, 6.2832); }
    }
    ctx.lineWidth = Math.max(0.5, 0.55 * u); ctx.strokeStyle = pal.ligne;
    ctx.globalAlpha = 0.38 * k; ctx.stroke(p);
    ctx.globalAlpha = 0.8 * k; ctx.fillStyle = pal.forme; ctx.fill(q);
  }
  if ((S.personne === 'squelette' || S.personne === 'complet') && POSES.length){
    const C = MP.vision.PoseLandmarker.POSE_CONNECTIONS, p = new Path2D(), q = new Path2D();
    for (const lm of POSES){
      for (const c of C){
        const a = lm[c.start], b = lm[c.end];
        if (!a || !b || (a.visibility ?? 1) < 0.4 || (b.visibility ?? 1) < 0.4) continue;
        p.moveTo(a.x * W, a.y * H); p.lineTo(b.x * W, b.y * H);
      }
      lm.forEach((a, i) => { if ((a.visibility ?? 1) < 0.4 || i < 11 && i > 0) return; const s = 3 * u; q.rect(a.x * W - s, a.y * H - s, s * 2, s * 2); });
    }
    ctx.lineWidth = Math.max(1, 1.3 * u); ctx.strokeStyle = pal.forme;
    ctx.globalAlpha = 0.85 * k; ctx.stroke(p);
    ctx.lineWidth = Math.max(0.8, u); ctx.strokeStyle = pal.ligne; ctx.stroke(q);
  }
  ctx.globalAlpha = 1;
}

/* ==========================================================
   13. SON (Web Audio : basses, médiums, aigus, temps forts)
   ========================================================== */
const AU = { ctx: null, el: null, an: null, data: null, dest: null, url: null, name: '', playing: false,
  bass: 0, mid: 0, high: 0, beat: 0, avg: 0 };

function loadAudio(file){
  if (!file) return;
  if (file.size > 15 * 1024 * 1024) return notify('Son trop lourd : 15 Mo maximum.', true);
  const url = URL.createObjectURL(file), el = new Audio();
  el.loop = true; el.preload = 'auto'; el.src = url;
  el.onloadedmetadata = () => {
    if (isFinite(el.duration) && el.duration > 180.5){ URL.revokeObjectURL(url); return notify('Son trop long : 3 minutes maximum.', true); }
    removeAudio(true);
    try {
      AU.ctx = AU.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const s = AU.ctx.createMediaElementSource(el);
      AU.an = AU.ctx.createAnalyser(); AU.an.fftSize = 1024; AU.an.smoothingTimeConstant = 0.55;
      AU.data = new Uint8Array(AU.an.frequencyBinCount);
      AU.dest = AU.dest || AU.ctx.createMediaStreamDestination();
      s.connect(AU.an); AU.an.connect(AU.ctx.destination); s.connect(AU.dest);
    } catch (e){ console.warn(e); return notify("Impossible d'analyser ce son.", true); }
    AU.el = el; AU.url = url; AU.name = file.name || 'son';
    updateAudioUI(); notify('Son chargé. Appuie sur Lire le son.');
  };
  el.onerror = () => { URL.revokeObjectURL(url); notify('Ce navigateur ne lit pas ce son. Essaie MP3.', true); };
}
function removeAudio(silent){
  if (AU.el){ AU.el.pause(); AU.el.removeAttribute('src'); }
  if (AU.url) URL.revokeObjectURL(AU.url);
  AU.el = null; AU.url = null; AU.playing = false; AU.bass = AU.mid = AU.high = AU.beat = 0;
  if (!silent){ updateAudioUI(); dirty = true; }
}
async function playAudio(on){
  if (!AU.el) return;
  if (on){
    try { if (AU.ctx.state !== 'running') await AU.ctx.resume(); await AU.el.play(); AU.playing = true; }
    catch (e){ notify('Lecture du son impossible.', true); }
  } else { AU.el.pause(); AU.playing = false; }
  updateAudioUI(); dirty = true;
}
function updateAudioUI(){
  const has = !!AU.el;
  $('#aName').textContent = has ? AU.name : 'Aucun son';
  $('#aPlay').disabled = !has; $('#aDel').disabled = !has;
  $('#aPlay').textContent = AU.playing ? 'Pause son' : 'Lire le son';
  refreshDeps();
}
// Lecture des bandes de fréquence, une fois par frame
function updateAudio(){
  if (!AU.playing || !AU.an){ AU.bass *= 0.85; AU.mid *= 0.85; AU.high *= 0.85; AU.beat *= 0.85; return; }
  AU.an.getByteFrequencyData(AU.data);
  const hz = AU.ctx.sampleRate / AU.an.fftSize;
  const band = (a, b) => { let s = 0, n = 0; for (let i = Math.max(1, Math.floor(a / hz)); i <= Math.min(AU.data.length - 1, Math.ceil(b / hz)); i++){ s += AU.data[i]; n++; } return n ? s / n / 255 : 0; };
  const b = band(20, 150), m = band(150, 2000), h = band(2000, 9000);
  AU.bass = Math.max(b, AU.bass * 0.82); AU.mid = Math.max(m, AU.mid * 0.85); AU.high = Math.max(h * 1.6, AU.high * 0.8);
  if (b > AU.avg * 1.3 && b > 0.25) AU.beat = 1; else AU.beat *= 0.88;
  AU.avg = AU.avg * 0.94 + b * 0.06;
}

/* ==========================================================
   14. TEXTURES
   ========================================================== */
function makeGrain(){
  const c = document.createElement('canvas'); c.width = c.height = 160;
  const g = c.getContext('2d'), im = g.createImageData(160, 160), r = mulberry32(S.seed * 31 + 5);
  for (let j = 0; j < im.data.length; j += 4){
    const v = r() < 0.5 ? 0 : 255;
    im.data[j] = im.data[j + 1] = im.data[j + 2] = v;
    im.data[j + 3] = (r() * r() * 255) | 0;
  }
  g.putImageData(im, 0, 0);
  grainPat = ctx.createPattern(c, 'repeat');
}
function scanPattern(u){
  const N = Math.max(2, Math.round(3 * u));
  if (scanPat && scanPat.N === N) return scanPat.p;
  const c = document.createElement('canvas'); c.width = 1; c.height = N;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.9)'; g.fillRect(0, 0, 1, Math.max(1, Math.round(N / 3)));
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, N - 1, 1, 1);
  scanPat = { N, p: ctx.createPattern(c, 'repeat') };
  return scanPat.p;
}

/* ==========================================================
   15. FOND : photo traitée + bandes de balayage
   ========================================================== */
function drawBase(c, W, H, pal, anim){
  const op = S.opacite / 100;
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  c.fillStyle = pal.fond; c.fillRect(0, 0, W, H);
  if (op > 0){
    drawSource(c, W, H);
    if (S.couleur !== 'original'){
      c.globalCompositeOperation = 'saturation'; c.fillStyle = '#808080'; c.fillRect(0, 0, W, H);
      c.globalCompositeOperation = 'overlay'; c.globalAlpha = 0.35; c.drawImage(c.canvas, 0, 0);
      if (S.couleur === 'teinte'){ c.globalCompositeOperation = 'color'; c.globalAlpha = 0.55; c.fillStyle = pal.ligne; c.fillRect(0, 0, W, H); }
      c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    }
    if (op < 1){ c.globalAlpha = 1 - op; c.fillStyle = pal.fond; c.fillRect(0, 0, W, H); c.globalAlpha = 1; }
  }
  const amt = S.lignes / 100;
  if (amt > 0){
    const u = Math.max(W, H) / 1200;
    const r = mulberry32(S.seed * 13 + (anim ? ((frameNo / 5) | 0) : 0));
    const n = Math.round(3 + amt * 20);
    for (let k = 0; k < n; k++){
      const y = r() * H, h = (2 + r() * r() * 30) * u, dx = (r() - 0.5) * 70 * u * amt;
      c.globalAlpha = 1; c.drawImage(c.canvas, 0, y, W, h, dx, y, W, h);
      c.globalAlpha = (0.05 + 0.2 * r()) * amt; c.fillStyle = r() < 0.55 ? '#000' : '#fff'; c.fillRect(0, y, W, h);
    }
